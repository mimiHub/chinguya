            schema: { $ref: '#/components/schemas/FaqRequest' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Faq' }
        '400':
          description: 질문·답변 누락 또는 길이 초과(`VALIDATION_ERROR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/faqs/{faqId}:
    parameters:
      - name: faqId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [admin-faq]
      x-screens: [S4-A1]
