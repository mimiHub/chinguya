        이력과 카테고리를 그대로 승계**한다(요청 본문에 카테고리가 없는 이유).

        명칭은 요청 본문으로 받는다 — 삭제된 명칭은 재사용 가능해서 그 사이 같은
        이름의 활성 자산이 생겼을 수 있고, 그때는 409 `DUPLICATE_ASSET_NAME` 로
        **명칭 변경을 요구**한다(A2-M4 모달의 입력 항목이 명칭인 이유).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetNameRequest' }
      responses:
        '200':
          description: 복원 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '400':
          description: name 누락 또는 공백만 입력
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AssetNotFound'
        '409':
          description: |
            `DUPLICATE_ASSET_NAME` — 같은 명칭의 활성 자산이 이미 있음(명칭 변경 필요)
            / `ASSET_NOT_DELETED` — 삭제 상태가 아니라 복원할 게 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/inventory/assets/{assetId}/snapshot:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [admin-inventory]
      x-screens: [S1-A3]
      summary: 월간 재고 스냅샷 (달력, S1-A3)
      description: |
        그 달 전체 일자의 계산된 스냅샷을 한 번에 돌려준다 — 달력이 이 배열 하나로
        잔여/고객 가용 색상과 재고 조정 있는 날 점 표시를 그린다.

        그날 총 보유 = 그 날짜의 기준 보유량 + 그 날짜에 걸리는 **보유** 조정 delta 합계
        (0 미만 불가). 그날 여행사 할당 = 여행사마다 (기준 할당 + 그 여행사 할당 조정 합)을
        더한 값이고, `customerAvailable` = max(`totalStock` − `allocated`, 0).
        여행사가 없거나 할당이 없으면 `customerAvailable` = `totalStock`.

        ⚠ `reserved` 는 예약 백엔드가 생기기 전까지 항상 0이다(헤더 TODO 7).
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer }
        - name: month
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: 그 달 일자별 스냅샷 배열
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InventoryDaySnapshot' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AssetNotFound'

  /admin/inventory/assets/{assetId}/days/{date}:
