  /admin/inventory/assets/{assetId}/allocations:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin-inventory]
      x-screens: [S1-A3]
      summary: 여행사 기준 할당 변경 (A3-M4)
      description: |
        기준 보유량 변경(A3-M1)과 같은 방식 — 계약 변경 같은 **영구적인 변화**를 적용
        시작일과 함께 이력으로 쌓는다(덮어쓰지 않음). 시작일 이전 날짜와 이미 걸린 할당
        조정에는 영향을 주지 않는다. `value` 0 이면 그날부터 할당 해제.

        **할당 합 > 총 보유가 되는 날이 생기면 저장하지 않고 409** 를 돌려준다. 검사
        범위는 여행사가 예약할 수 있는 날짜(오늘 +3일 이후)부터 시작일 기준 3개월이다 —
        마감(D-3)이 지난 날짜의 할당은 어차피 고객 가용으로 반환되므로 검사하지 않는다.
        이미 할당 초과인 날(보유가 줄어 생긴 경우)에서 할당을 **줄이는** 변경은 막지 않는다 —
        그래야 초과를 푸는 수정이 가능하다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllocationChangeRequest' }
      responses:
        '200':
          description: 변경 후 여행사별 현재 기준 할당(목록 조회와 같은 모양)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AgencyAllocation' }
        '400':
          description: agencyId·value·startDate 누락 또는 값 오류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 존재하지 않는 자산(`ASSET_NOT_FOUND`) 또는 존재하지 않거나 삭제된 여행사(`AGENCY_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          $ref: '#/components/responses/AllocationExceedsStock'

  /admin/inventory/assets/{assetId}/adjustments:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin-inventory]
      x-screens: [S1-A3]
      summary: 재고 조정 추가 (A3-M2)
      description: |
        수리·임시 임차 등 **일시적인 증감**(±N)을 기간(+요일 지정)과 함께 기록한다.
        같은 날짜에 여러 조정이 걸리면 전부 합산된다. 저장 전에 초과 여부를 먼저
        확인하려면 `/preview` 를 먼저 부른다(A3-M3).

        **대상**은 `agencyId` 로 가른다 — null이면 **보유** 조정(총 보유 증감), 값이
        있으면 그 여행사의 **할당** 조정(그 여행사 할당만 증감). 할당 조정으로
        할당 합 > 총 보유가 되는 날이 생기면 저장하지 않고 409(검사 범위는 A3-M4와 같다).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentRequest' }
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryAdjustment' }
        '400':
          description: delta·startDate 누락 또는 값 오류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 존재하지 않는 자산(`ASSET_NOT_FOUND`) 또는 존재하지 않거나 삭제된 여행사(`AGENCY_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          $ref: '#/components/responses/AllocationExceedsStock'

  /admin/inventory/assets/{assetId}/adjustments/preview:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [admin-inventory]
      x-screens: [S1-A3]
      summary: 재고 조정 추가 시 초과 미리보기 (A3-M3)
      description: |
        아무것도 저장하지 않는 계산 전용 엔드포인트 — 그래서 SUPER_ADMIN이 아니어도
        (조회 권한만 있어도) 부를 수 있다. 이 조정을 실제로 적용했을 때 다음 중 하나가
        되는 날짜를 돌려준다:
        - **예약 초과** — 고객 예약 > 고객 가용(총 보유 − 할당).
        - **할당 초과** — 여행사 할당 합 > 총 보유(`allocated` > `totalStockAfter`).

        보유 조정(`agencyId` null)은 두 경우 모두 경고 후 저장을 허용한다. 할당 조정은
        할당 초과가 있으면 실제 저장이 409로 막히므로, 화면은 이 결과로 미리 막는다.

        ⚠ `reserved` 가 항상 0인 동안(헤더 TODO 7)은 예약 초과는 나오지 않고 할당 초과만 나온다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentRequest' }
      responses:
        '200':
          description: 초과가 발생하는 날짜 목록(없으면 빈 배열)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OverCapacityDate' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AssetNotFound'

