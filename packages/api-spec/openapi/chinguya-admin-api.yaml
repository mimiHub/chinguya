    post:
      tags: [admin-inventory]
      x-screens: [S1-A3]
      summary: 여행사 기준 할당 변경 (A3-M4)
      description: |
        기준 보유량 변경(A3-M1)과 같은 방식 — 계약 변경 같은 **영구적인 변화**를 적용
        시작일과 함께 이력으로 쌓는다(덮어쓰지 않음). 시작일 이전 날짜와 이미 걸린 할당
        조정에는 영향을 주지 않는다. `value` 0 이면 그날부터 할당 해제.

        **할당 합 > 총 보유가 되는 날이 생기면 저장하지 않고 409** 를 돌려준다. 검사
        범위는 여행사가 예약할 수 있는 날짜(오늘 +3일 이후)부터 시작일 기준 3개월이다 —
        마감(D-3)이 지난 날짜의 할당은 어차피 고객 가용으로 반환되므로 검사하지 않는다.
        이미 할당 초과인 날(보유가 줄어 생긴 경우)에서 할당을 **줄이는** 변경은 막지 않는다 —
