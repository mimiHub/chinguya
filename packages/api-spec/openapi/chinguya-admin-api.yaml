      description: |
        3장을 **통째로** 저장한다(화면의 '배너 저장' 버튼 하나가 3장을 다 저장한다).
        `slot` 1·2·3이 하나씩 있어야 한다 — 아니면 400 `INVALID_BANNERS`.

        새 이미지는 먼저 `POST /admin/content/images` 로 올리고, 받은 `imageUrl` 을
        여기 `pcImageUrl`·`mobileImageUrl` 에 넣는다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeroBannersUpdateRequest' }
      responses:
        '200':
          description: 저장된 배너 3장
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HeroBanner' }
        '400':
          description: 필수값 누락·형식 오류(`VALIDATION_ERROR`) 또는 slot 구성 오류(`INVALID_BANNERS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: INVALID_BANNERS
                message: 배너 1·2·3이 하나씩 있어야 합니다.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/content/intro:
    get:
      tags: [admin-content]
      x-screens: [S4-A3]
      summary: 서비스 소개 본문 조회 (S4-A3)
      responses:
        '200':
          description: 서비스 소개(S4-C2) 본문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceIntro' }
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags: [admin-content]
      x-screens: [S4-A3]
      summary: 서비스 소개 본문 저장 (S4-A3)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceIntro' }
      responses:
        '200':
          description: 저장된 본문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceIntro' }
        '400':
          description: 본문 누락 또는 길이 초과(`VALIDATION_ERROR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/content/images:
    post:
      tags: [admin-content]
      x-screens: [S4-A3]
      summary: 콘텐츠 이미지 업로드 (S4-A3)
      description: |
        이미지 한 장을 서버 디스크에 저장하고 주소(`imageUrl`)를 돌려준다. 이것만으로는
        배너가 바뀌지 않는다 — `PUT /admin/content/banners` 로 저장해야 반영된다.

        - 허용 형식: PNG · JPG · WEBP. 확장자가 아니라 **파일 내용**으로 판정한다.
        - 최대 10MB.
        - `imageUrl` 은 `/content/images/{fileName}` 형태다. Core의 네임스페이스
          프리픽스 뒤에 붙는 경로라, 관리자는 `/admin` + `imageUrl` 로 읽는다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 저장됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentImageUploadResult' }
        '400':
          description: 파일 누락(`VALIDATION_ERROR`) 또는 허용하지 않는 형식(`INVALID_IMAGE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: INVALID_IMAGE
                message: PNG·JPG·WEBP 이미지만 올릴 수 있습니다.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: 10MB 초과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: IMAGE_TOO_LARGE
                message: 이미지는 10MB까지 올릴 수 있습니다.

  /admin/content/images/{fileName}:
    get:
      tags: [admin-content]
      x-screens: [S4-A3]
      summary: 업로드한 콘텐츠 이미지 보기 (S4-A3)
      description: 관리자 화면의 현재 이미지 미리보기용. 파일명은 업로드 응답의 것만 유효하다.
      parameters:
        - name: fileName
          in: path
          required: true
          schema: { type: string, example: 3f1c2a9e-8d7b-4c6a-9e1f-2b3c4d5e6f70.png }
      responses:
        '200':
          description: 이미지
          content:
            image/png: {}
            image/jpeg: {}
            image/webp: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 없는 파일
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: CONTENT_IMAGE_NOT_FOUND
                message: 이미지를 찾을 수 없습니다.

  # ---------------------------------------------------------------------------
  # 여행사 인보이스 (S2-A5/A6)
  #
  # 인보이스는 **헤더만 저장한다**(`invoice` 테이블 = 여행사·대상월·발행일·정산일).
  # 라인아이템과 금액은 저장하지 않고 `agency_reservation` 에서 매번 집계한다 —
  # 여행사 인보이스(S2-G7)가 이미 쓰는 방식이라 두 화면의 합계가 구조적으로 같아진다.
  # 값이 흔들리지 않는 근거는 취소 마감이 D-3 이라는 점이다. 발행일(매월 1일)에는
  # 전월 이용일 예약이 전부 취소 불가라 집계 결과가 더는 변하지 않는다.
  #
  # 발행은 **자동·멱등**이다. 수동 등록 버튼이 없고(와이어프레임 a-invoice),
  # 목록을 조회할 때 발행 시점이 지난 달의 헤더가 없으면 그 자리에서 만든다.
  # 배치 스케줄러가 없어서 택한 방식이라, 나중에 배치가 생기면 같은 멱등 로직을 부른다.
  # ---------------------------------------------------------------------------
  /admin/invoices:
    get:
      tags: [admin-invoice]
      x-screens: [S2-A5]
      summary: 인보이스 목록 (S2-A5)
      description: |
        여행사·월별 인보이스를 **전량** 반환한다(관리자 목록의 기본 관례 — 페이지네이션은
        S1-A6 예약 관리에만 있다). 여행사 수 × 운영 개월 수라 증가가 완만하다.

        응답은 두 덩어리다.
        - `invoices` — **이미 발행된** 인보이스. 최근 월 먼저, 같은 월이면 여행사명 순.
          호출 시점에 발행 시점(대상월 다음 달 1일)이 지난 달의 헤더가 없으면 **여기서
          만들어 넣는다**(멱등). 그래서 배치 없이도 목록이 스스로 최신이 된다.
        - `pending` — **아직 발행 전인 이번 달** 사용액. 사용 가능 여행사마다 1건이고,
          발행되지 않았으므로 `issuedAt`·정산 상태가 없다. 와이어프레임의 '예정' 태그다.

        대상 월(`period`)·이번 달 판단은 **서버가 한다**. 브라우저 시계를 쓰면 월초에
        하루 어긋난다(S2-G7 과 같은 이유).
      parameters:
        - name: agencyId
          in: query
          required: false
          schema: { type: string }
          description: |
            특정 여행사만. 비우면 전체다. 없는 여행사 id 면 빈 목록(404 아님) —
            화면의 필터가 삭제된 여행사를 들고 있을 수 있어서다.
      responses:
        '200':
          description: 인보이스 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInvoiceList' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/invoices/{invoiceId}:
    parameters:
      - $ref: '#/components/parameters/InvoiceIdPath'
    get:
      tags: [admin-invoice]
      x-screens: [S2-A6]
      summary: 인보이스 상세 (S2-A6)
      description: |
        발행된 인보이스 1건의 라인아이템과 합계를 반환한다. **발행 전(`pending`) 건에는
        id 가 없으므로 이 엔드포인트로 들어올 수 없다** — 목록의 '예정' 카드는 링크가 아니다.

        라인아이템 = 그 달에 **이용일**이 든 **완료·취소** 예약 1건. 여행사 인보이스(S2-G7)와
        같은 집계라 두 화면의 합계가 항상 일치한다.

        화면은 `settleable` 로 '입금 확인' 버튼 노출을 가른다(S1-A7 의 `depositConfirmable`
        과 같은 관례 — 상태값을 화면이 해석하지 않는다).
      responses:
        '200':
          description: 인보이스 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInvoiceDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/InvoiceNotFound'

  /admin/invoices/{invoiceId}/settle:
    parameters:
      - $ref: '#/components/parameters/InvoiceIdPath'
    post:
      tags: [admin-invoice]
      x-screens: [S2-A6]
      summary: 입금(정산) 확인 (S2-A6)
      description: |
        인보이스를 **정산 완료**로 바꾼다. 실제 입금은 시스템 밖에서 받으므로, 이 호출은
        "돈이 들어온 걸 확인했다"는 관리자의 선언이다. 되돌리는 엔드포인트는 없다
        (필요해지면 그때 만든다 — 취소요청 확정 S1-A9 와 같은 판단).

        이미 정산된 건이면 409 `INVOICE_ALREADY_SETTLED`. 조건부 UPDATE 로 막으므로
        두 관리자가 동시에 눌러도 한 번만 성공한다. 슈퍼어드민 전용.
      responses:
        '200':
          description: 정산 처리된 인보이스
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminInvoiceDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/InvoiceNotFound'
        '409':
          description: 이미 정산 완료된 인보이스(`INVOICE_ALREADY_SETTLED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# -----------------------------------------------------------------------------
components:

  securitySchemes:
    adminCookieAuth:
      type: apiKey
      in: cookie
      name: admin_access_token
      description: |
        관리자 액세스 토큰(JWT). 클레임 = adminId·loginId·role, 유효 **4시간**.

        ⚠ 고객 문서(chinguya-slice1-openapi.yaml)의 `cookieAuth` 와 **다른 쿠키다**.
        고객은 `access_token`(30분), 관리자는 `admin_access_token`(4시간).
        미들웨어·BFF가 쿠키 이름을 혼동하면 인증이 조용히 어긋난다.

  parameters:
    BookingIdPath:
      name: bookingId
      in: path
      required: true
      schema: { type: string }
    CancellationIdPath:
      name: cancellationId
      in: path
      required: true
      schema: { type: string }
    InvoiceIdPath:
      name: invoiceId
      in: path
      required: true
      schema: { type: string }
    NoticeIdPath:
      name: noticeId
      in: path
      required: true
      schema: { type: string }

  responses:
    AdminNotFound:
      description: 존재하지 않거나 삭제된 관리자 계정
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: ADMIN_NOT_FOUND
            message: 관리자 계정을 찾을 수 없습니다.
    DuplicateLoginId:
      description: 같은 아이디의 계정이 이미 있음(삭제된 계정 포함)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: DUPLICATE_LOGIN_ID
            message: 이미 사용 중인 아이디입니다.
    LastSuperAdmin:
      description: 마지막 슈퍼어드민을 STAFF로 내리거나 삭제하려 했다
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: LAST_SUPER_ADMIN
            message: 슈퍼어드민이 최소 1명은 있어야 합니다.
    Unauthorized:
      description: 인증 필요/만료 — 쿠키가 없거나 토큰이 유효하지 않다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidCredentials:
      description: 아이디 또는 비밀번호 불일치
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: INVALID_CREDENTIALS
            message: 아이디 또는 비밀번호가 올바르지 않습니다.
    Forbidden:
      description: 권한 부족 — STAFF가 쓰기 메서드를 시도한 경우.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BookingNotFound:
      description: 존재하지 않는 예약(`BOOKING_NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidBookingStatus:
      description: 지금 상태에서는 할 수 없는 처리(`INVALID_BOOKING_STATUS`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CancellationNotFound:
      description: 존재하지 않는 취소 요청(`CANCELLATION_NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvoiceNotFound:
      description: 존재하지 않는 인보이스(`INVOICE_NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoticeNotFound:
      description: 존재하지 않는 글(`NOTICE_NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidNotice:
      description: |
        입력이 규칙에 맞지 않다(`VALIDATION_ERROR`). 제목·본문이 비었거나 길이를 넘었을 때,
        공지사항인데 이벤트 기간을 보냈을 때, 종료일만 보냈을 때, 시작일 > 종료일일 때,
        첨부가 5장을 넘을 때다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AssetNotFound:
      description: 존재하지 않는 자산
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: ASSET_NOT_FOUND
            message: 자산을 찾을 수 없습니다.
    DuplicateAssetName:
      description: 같은 명칭의 **활성** 자산이 이미 있음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: DUPLICATE_ASSET_NAME
            message: 이미 사용 중인 자산 명칭입니다.
    ProductNotFound:
      description: 존재하지 않는 상품
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: PRODUCT_NOT_FOUND
            message: 상품을 찾을 수 없습니다.
    AdjustmentNotFound:
      description: 존재하지 않는 재고 조정
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: ADJUSTMENT_NOT_FOUND
            message: 재고 조정을 찾을 수 없습니다.
    AllocationExceedsStock:
      description: 여행사 할당 합이 총 보유를 넘는 날짜가 생겨 저장하지 않았다(A3-M4·할당 조정).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: ALLOCATION_EXCEEDS_STOCK
            message: '여행사 할당 합이 총 보유를 넘는 날짜가 있습니다: 2027-07-20(할당 4 / 총 보유 3)'
    AgencyNotFound:
      description: 존재하지 않거나 삭제된 여행사
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: AGENCY_NOT_FOUND
            message: 여행사를 찾을 수 없습니다.
    DuplicateAgencyName:
      description: 같은 명칭의 **활성** 여행사가 이미 있음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: DUPLICATE_AGENCY_NAME
            message: 이미 사용 중인 여행사 명칭입니다.
    InquiryNotFound:
      description: 존재하지 않는 문의
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: INQUIRY_NOT_FOUND
            message: 문의를 찾을 수 없습니다.
    FaqNotFound:
      description: 존재하지 않는 FAQ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: FAQ_NOT_FOUND
            message: FAQ를 찾을 수 없습니다.

  schemas:

    AdminRole:
      type: string
      enum: [SUPER_ADMIN, STAFF]
      description: |
        관리자 등급.
        - `SUPER_ADMIN` — 전체 권한. 쓰기 가능.
        - `STAFF` — 일반 관리자. **조회 전용**(접객용).

    LoginRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId:
          type: string
          description: 관리자 아이디. admin_account.login_id 와 대조(고유).
        password:
          type: string
          format: password
          description: 평문 비밀번호. 서버가 BCrypt 해시와 대조한다.

    AdminSessionResponse:
      type: object
      required: [adminId, loginId, role, expiresAt]
      properties:
        adminId:
          type: string
          description: 관리자 PK(숫자지만 문자열로 직렬화된다).
        loginId: { type: string }
        role: { $ref: '#/components/schemas/AdminRole' }
        expiresAt:
          type: string
          format: date-time
          description: 액세스 토큰 만료 시각(UTC). 발급 시점 +4시간.

    AdminAccount:
      type: object
      required: [adminId, loginId, role]
      description: 관리자 계정 한 건(S0-A5/A6). 비밀번호는 내려주지 않는다.
      properties:
        adminId:
          type: string
          description: 관리자 PK(숫자지만 문자열로 직렬화된다). AdminSessionResponse.adminId 와 같은 값.
        loginId: { type: string }
        role: { $ref: '#/components/schemas/AdminRole' }

    AdminAccountCreateRequest:
      type: object
      required: [loginId, password, role]
      properties:
        loginId:
          type: string
          pattern: '^[A-Za-z0-9._-]{4,50}$'
          description: 영문·숫자·`.`·`_`·`-` 4~50자. 등록 후 바꿀 수 없다.
        password:
          type: string
          format: password
          pattern: '^[\x21-\x7E]{8,72}$'
          description: 공백 없는 영문·숫자·기호 8~72자(BCrypt가 72바이트까지만 쓴다). 서버는 해시만 저장한다.
        role: { $ref: '#/components/schemas/AdminRole' }

    AdminAccountUpdateRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/AdminRole' }
        password:
          type: [string, 'null']
          format: password
          pattern: '^[\x21-\x7E]{8,72}$'
          description: 새 비밀번호. 생략하거나 null이면 기존 비밀번호를 유지한다.

    Asset:
      type: object
      required: [assetId, name, category, deleted, hasInventoryRecords, productCount, createdAt, updatedAt]
      description: |
        대여 자산의 **명칭·카테고리 마스터**(S1-A2). 자산은 이 둘만 가진다 — 보유
        대수는 전부 재고 세팅(S1-A3)이 `자산 × 날짜` 단위로 관리하므로 이 스키마에
        수량 필드는 없다. 사유(수리/입고/외부임대)도 관리하지 않는다.
      properties:
        assetId:
          type: string
          description: 자산 PK(숫자지만 문자열로 직렬화된다).
        name: { type: string }
        category:
          allOf:
            - $ref: '#/components/schemas/AssetCategory'
          description: |
            등록 때 정해지고 이후 바뀌지 않는다. 복원해도 그대로 승계한다.
        deleted:
          type: boolean
          description: |
            소프트 삭제 여부. true 면 화면 하단 '삭제됨' 섹션에 놓고 수정은 막되
            복원은 허용한다. 재고 세팅의 자산 선택기에서도 제외한다.
        hasInventoryRecords:
          type: boolean
          description: |
            이 자산을 참조하는 **날짜별 재고 레코드(기준 보유량 이력 또는 재고 조정)가
            1건 이상** 있는지. 삭제 모달의 문구·처리 분기(CASE 1 완전 삭제 / CASE 2
            소프트 삭제)를 삭제를 부르기 전에 정하기 위한 값이다.
        productCount:
          type: integer
          description: |
            이 자산에 연결된 **삭제되지 않은 상품 수**. 자산 카드에 '연결 상품 N개'로
            표시하고(S1-A2), 1 이상이면 삭제 모달이 **CASE 0**(삭제 불가, 상품 먼저
            삭제) 문구로 간다 — 삭제를 부르기 전에 정하기 위한 값이다.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: 소프트 삭제 시각. `deleted` 가 false 면 null.

    AssetCategory:
      type: string
      enum: [BICYCLE, FISHING_ROD]
      description: |
        자산의 상위 분류 — 자전거 / 낚싯대. 기획서에 고정된 두 값이며 관리자가 늘릴 수
        없다(S1-A2). 고객앱 카테고리 칩(S1-C1)과 관리자 상품 목록 탭(S1-A4)이 이 값을
        기준으로 갈리고, 상품의 선택 가능 옵션도 여기서 정해진다
        (자전거 = 2시간/1일/2일/야간, 낚싯대 = 1일/2일).

        고객 Core API의 `ProductCategory`(chinguya-slice1-openapi.yaml)와 **같은 값**이다.

    AssetCreateRequest:
      type: object
      required: [name, category]
      description: |
        자산 등록(A2-M1) 요청 본문. 카테고리를 받는 건 등록뿐이라 수정·복원과 스키마를
        나눴다.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: 자산 명칭. 서버가 앞뒤 공백을 제거한 뒤 저장·중복검사한다.
        category:
          $ref: '#/components/schemas/AssetCategory'

    AssetNameRequest:
      type: object
      required: [name]
      description: |
        자산 명칭 수정(A2-M2)·복원(A2-M4)이 공유하는 요청 본문. 두 경우 모두 입력 항목이
        명칭 하나뿐이다 — 카테고리는 등록 때만 정하고 여기서는 바꿀 수 없다.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: 자산 명칭. 서버가 앞뒤 공백을 제거한 뒤 저장·중복검사한다.

    AssetDeleteResult:
      type: object
      required: [deletion]
      properties:
        deletion:
          type: string
          enum: [HARD, SOFT]
          description: |
            - `HARD` — 재고 레코드가 없어 행을 완전히 지웠다. 목록에서 사라진다.
            - `SOFT` — 재고 레코드가 있어 `deleted_at` 만 찍었다. '삭제됨'으로 남고 복원 가능.

    InventoryDaySnapshot:
      type: object
      required: [date, baseline, totalStock, allocated, customerAvailable, closed, reserved, remaining, hasAdjustment]
      description: 달력 한 칸(하루)의 계산된 스냅샷(S1-A3). 월간 조회가 이 배열을 한 번에 돌려준다.
      properties:
        date: { type: string, format: date }
        baseline:
          type: integer
          description: 그 날짜에 적용되던 기준 보유량(오늘 기준 최신값이 아니라 "그날" 기준).
        totalStock:
          type: integer
          description: 그날 총 보유 = 기준 보유량 + 그날 걸리는 보유 조정 delta 합계(0 미만 불가).
        allocated:
          type: integer
          description: |
            그날 여행사 할당 합(고객 가용에서 빠지는 양). 여행사마다 기준 할당 + 그 여행사
            할당 조정 합(0 미만 불가)을 더한다. 여행사 예약 마감(이용일 D-3)이 지난 날짜는
            안 팔린 할당이 반환되므로 여행사 예약 수만 남는다(헤더 TODO 8).
        customerAvailable:
          type: integer
          description: max(totalStock − allocated, 0). 할당 합이 총 보유를 넘는 날(할당 초과)은 0.
        closed:
          type: boolean
          description: 매장 휴무(전 자산 공통) 여부.
        reserved:
          type: integer
          description: |
            고객 예약 확정 수량. ⚠ 예약 백엔드가 없어 헤더 TODO 7이 해소되기 전까지 항상 0.
        remaining:
          type: integer
          description: customerAvailable − reserved. 마이너스면 재고 초과.
        hasAdjustment:
          type: boolean
          description: 이 날짜에 걸리는 재고 조정(보유·할당)이 1건 이상 있는지(달력 점 표시용).

    InventoryDayDetail:
      type: object
      required: [date, baseline, totalStock, allocated, allocationReleased, customerAvailable, closed, reserved, remaining, allocations, adjustments]
      description: 선택일 상세(S1-A3) — 하단 패널이 이 값으로 그린다.
      properties:
        date: { type: string, format: date }
        baseline: { type: integer }
        totalStock: { type: integer }
        allocated:
          type: integer
          description: 고객 가용에서 빠지는 여행사 할당 합(InventoryDaySnapshot.allocated 와 같은 값).
        allocationReleased:
          type: boolean
          description: |
            여행사 예약 마감(이용일 D-3)이 지나 안 팔린 할당이 고객 가용으로 반환된 날짜인지.
            true면 `allocations[].allocated` 는 설정값 그대로이고 `allocated` 에는 여행사 예약 수만 남는다.
        customerAvailable: { type: integer }
        closed: { type: boolean }
        reserved: { type: integer }
        remaining: { type: integer }
        allocations:
          type: array
          description: 그날 할당이 있거나 할당 조정이 걸린 여행사별 줄(여행사 등록 순).
          items: { $ref: '#/components/schemas/AgencyAllocationLine' }
        adjustments:
          type: array
          description: 그날 걸리는 조정 전부 — 보유 조정과 할당 조정이 섞여 있고 `agencyId` 로 구분한다.
          items: { $ref: '#/components/schemas/InventoryAdjustment' }

    AgencyAllocationLine:
      type: object
      required: [agencyId, agencyName, baseline, allocated]
      description: 선택일 상세의 여행사 한 줄.
      properties:
        agencyId: { type: string }
        agencyName: { type: string }
        baseline:
          type: integer
          description: 그 날짜에 적용되던 그 여행사의 기준 할당.
        allocated:
          type: integer
          description: 기준 할당 + 그 여행사 할당 조정 합(0 미만 불가). 삭제된 여행사는 삭제일부터 0.

    AgencyAllocation:
      type: object
      required: [agencyId, agencyName, value]
      description: 여행사의 "지금"(오늘 기준) 기준 할당.
      properties:
        agencyId: { type: string }
        agencyName: { type: string }
        value: { type: integer }

    AllocationChangeRequest:
      type: object
      required: [agencyId, value, startDate]
      description: 여행사 기준 할당 변경 요청(A3-M4).
      properties:
        agencyId: { type: string }
        value: { type: integer, minimum: 0 }
        startDate: { type: string, format: date }
        memo: { type: string, maxLength: 200 }

    InventoryAdjustment:
      type: object
      required: [id, assetId, agencyId, agencyName, tag, delta, startDate, weekdays, memo, createdAt]
      description: 자산의 일시적 재고 증감 1건(A3-M2, 수리·임차 등). 대상이 여행사면 그 여행사 할당만 증감한다.
      properties:
        id: { type: string }
        assetId: { type: string }
        agencyId:
          type: [string, 'null']
          description: null이면 보유 조정, 값이 있으면 그 여행사의 할당 조정.
        agencyName:
          type: [string, 'null']
          description: 할당 조정의 대상 여행사명(삭제된 여행사도 이름은 남는다). 보유 조정이면 null.
        tag:
          type: string
          description: 화면·안내메일 표시용 자유 라벨(예 "임차"/"수리"). 코드값이 아니다.
        delta: { type: integer, description: 증감량(양수/음수). }
        startDate: { type: string, format: date }
        endDate:
          type: [string, 'null']
          format: date
          description: null이면 "종료일 미정"(진행 중) — 복귀일이 정해지면 수정으로 채운다.
        weekdays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: 특정 요일에만 반복 적용(0=일~6=토). 빈 배열이면 기간 내 모든 날짜.
        memo: { type: string }
        createdAt: { type: string, format: date-time }

    AdjustmentRequest:
      type: object
      required: [delta, startDate]
      description: 재고 조정 추가·수정(A3-M2)과 초과 미리보기가 공유하는 요청 본문.
      properties:
        agencyId:
          type: [string, 'null']
          description: 대상. null(또는 생략)이면 보유 조정, 값이 있으면 그 여행사의 할당 조정.
        tag: { type: string, maxLength: 60 }
        delta: { type: integer, description: 0이 아닌 증감량. }
        startDate: { type: string, format: date }
        endDate:
          type: [string, 'null']
          format: date
          description: null이면 종료일 미정.
        weekdays:
          type: [array, 'null']
          items: { type: integer, minimum: 0, maximum: 6 }
        memo: { type: string, maxLength: 200 }

    BaselineChangeRequest:
      type: object
      required: [value, startDate]
      description: 기준 보유량 변경 요청(A3-M1). 구매·처분처럼 영구적인 변화라 적용 시작일을 함께 받는다.
      properties:
        value: { type: integer, minimum: 0 }
        startDate: { type: string, format: date }
        memo: { type: string, maxLength: 200 }

    BaselineResponse:
      type: object
      required: [value]
      properties:
        value:
          type: integer
          description: 자산의 "지금"(오늘 날짜 기준) 기준 보유량.

    OverCapacityDate:
      type: object
      required: [date, reserved, totalStockAfter, allocated]
      description: |
        재고 조정을 실제로 적용하면 예약 초과(고객 예약 > 총 보유 − 할당) 또는 할당 초과
        (할당 합 > 총 보유)가 되는 날짜(A3-M3 초과 경고).
        ⚠ reserved가 항상 0인 동안(헤더 TODO 7)은 할당 초과만 나온다.
      properties:
        date: { type: string, format: date }
        reserved: { type: integer }
        totalStockAfter: { type: integer }
        allocated:
          type: integer
          description: 적용 후 그날 여행사 할당 합. totalStockAfter보다 크면 할당 초과.

    ClosureRequest:
      type: object
      required: [closed]
      description: 매장 휴무 토글 요청 — 전 자산 공통(자산별이 아니다).
      properties:
        closed: { type: boolean }

    ClosureResponse:
      type: object
      required: [date, closed]
      properties:
        date: { type: string, format: date }
        closed: { type: boolean }

    RentalOptionType:
      type: string
      enum: [HOURS_2, DAY_1, DAY_2, NIGHT]
      description: |
        대여 옵션 — 2시간 / 1일 / 2일 / 야간. 고객 Core API 의 동명 스키마와 같은 값이다.

        **선택 가능한 옵션은 연결 자산의 카테고리가 정한다**:
        자전거 = `HOURS_2`·`DAY_1`·`DAY_2`·`NIGHT`, 낚싯대 = `DAY_1`·`DAY_2`.

    Product:
      type: object
      required:
        [productId, assetId, assetName, category, optionType, displayName,
         customerPrice, agencyPrice, customerVisible, agencyVisible, imageUrls,
         deleted, createdAt, updatedAt]
      description: |
        상품 하나 = **연결 자산 1개 + 대여 옵션 1개**(S1-A5). 옵션마다 가격·사진·설명이
        달라서 자산 하나에 옵션 배열을 중첩시키지 않고 조합마다 독립된 상품으로 둔다.

        수량은 이 스키마에 없다 — 예약은 **연결 자산의 재고**(S1-A3)를 쓰고, 같은 자산의
        상품끼리 재고와 여행사 할당을 함께 사용한다.
      properties:
        productId:
          type: string
          description: 상품 PK(숫자지만 문자열로 직렬화된다).
        assetId:
          type: string
          description: 연결 자산 PK. **등록 때만 정해지고 이후 바뀌지 않는다.**
        assetName:
          type: string
          description: 연결 자산의 명칭. 목록(S1-A4)이 자산별로 묶을 때 소제목으로 쓴다.
        category:
          allOf:
            - $ref: '#/components/schemas/AssetCategory'
          description: 연결 자산의 카테고리. 상품이 따로 갖는 값이 아니라 자산에서 따라온다.
        optionType:
          allOf:
            - $ref: '#/components/schemas/RentalOptionType'
          description: 대여 옵션. **등록 때만 정해지고 이후 바뀌지 않는다.**
        displayName:
          type: string
          description: |
            화면에 쓰는 상품명 — **`자산명 · 옵션`** 형태로 서버가 만들어 준다
            (예: `전기자전거 · 2일`). 별도 입력 항목이 아니다(S1-A5).
        customerPrice:
          type: integer
          description: 고객가(KRW, 원 정수).
        agencyPrice:
          type: integer
          description: 여행사 정산가(KRW). **고객앱에는 절대 노출하지 않는다.**
        customerVisible:
          type: boolean
          description: 고객앱 목록 노출 여부. 상품을 지우지 않고 숨기는 토글(S1-A4).
        agencyVisible:
          type: boolean
          description: 여행사앱 목록 노출 여부. customerVisible 과 독립이다.
        crossRegionReturnExtraFee:
          type: [integer, 'null']
          description: |
            타지역 반납 추가요금(KRW). **2일(`DAY_2`) 상품에만** 값이 있고 그 외에는 null 이다.
        description:
          type: [string, 'null']
          description: 상세 설명. 없으면 null.
        imageUrls:
          type: array
          items: { type: string }
          description: 상품 이미지 URL. 배열 순서가 곧 표시 순서이고 **0번이 대표 이미지**다.
        deleted:
          type: boolean
          description: 소프트 삭제 여부. 자산과 달리 복원 API가 없다.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: 소프트 삭제 시각. `deleted` 가 false 면 null.

    ProductCreateRequest:
      type: object
      required: [assetId, optionType, customerPrice, agencyPrice, customerVisible, agencyVisible]
      description: |
        상품 등록(S1-A5) 요청 본문. `assetId`·`optionType` 을 받는 건 등록뿐이라
        수정과 스키마를 나눴다.
      properties:
        assetId:
          type: string
          description: 연결 자산 PK. **활성 자산만** 고를 수 있다.
        optionType:
          allOf:
            - $ref: '#/components/schemas/RentalOptionType'
          description: 연결 자산의 카테고리가 허용하는 옵션이어야 한다.
        customerPrice: { type: integer, minimum: 0 }
        agencyPrice: { type: integer, minimum: 0 }
        customerVisible: { type: boolean }
        agencyVisible: { type: boolean }
        crossRegionReturnExtraFee:
          type: [integer, 'null']
          minimum: 0
          description: 2일(`DAY_2`) 상품에만 허용. 그 외 옵션에 값을 주면 400이다.
        description:
          type: [string, 'null']
        imageUrls:
          type: array
          items: { type: string }
          description: 생략하면 이미지 없음. 빈 배열은 400이다(생략과 구분).

    ProductUpdateRequest:
      type: object
      required: [customerPrice, agencyPrice, customerVisible, agencyVisible]
      description: |
        상품 수정(S1-A5) 요청 본문. **연결 자산·옵션이 없다** — 등록 때 정한 값이 그대로
        가기 때문이다(화면에서도 읽기 전용). 보낸 값으로 통째로 교체한다.
      properties:
        customerPrice: { type: integer, minimum: 0 }
        agencyPrice: { type: integer, minimum: 0 }
        customerVisible: { type: boolean }
        agencyVisible: { type: boolean }
        crossRegionReturnExtraFee:
          type: [integer, 'null']
          minimum: 0
        description:
          type: [string, 'null']
        imageUrls:
          type: array
          items: { type: string }
          description: 생략하면 기존 이미지를 모두 지운다(통째로 교체).

    ProductVisibilityRequest:
      type: object
      description: |
        표출 토글(S1-A4) 전용. 둘 다 선택이지만 **최소 하나는 있어야 한다**.
        보내지 않은 쪽은 기존 값을 그대로 둔다.
      properties:
        customerVisible: { type: boolean }
        agencyVisible: { type: boolean }

    AgencyInvitationStatus:
      type: string
      enum: [NONE, PENDING, EXPIRED, ACCEPTED]
      description: |
        여행사의 **최신** 초대 상태. 목록·상세 화면의 배지 문구가 이 값에서 나온다.
        - `NONE` — 초대를 보낸 적이 없다(등록 직후 메일 발송에 실패한 경우도 여기).
        - `PENDING` — 살아 있는 초대가 있다(미사용·미만료).
        - `EXPIRED` — 마지막 초대가 만료됐다. 재발송이 필요하다.
        - `ACCEPTED` — 담당자가 링크로 계정 등록을 마쳤다. `accountRegistered` 도 true.

    Agency:
      type: object
      required: [agencyId, name, contactName, contactPhone, contactEmail, active, accountRegistered, invitationStatus, deleted, createdAt, updatedAt]
      description: |
        여행사(거래처) 마스터(S2-A1~A3). 로그인 계정은 별도 테이블이라 이 스키마에
        비밀번호 필드가 없고, 계정 존재 여부는 `accountRegistered`·`loginId` 로만 비친다.
      properties:
        agencyId:
          type: string
          description: 여행사 PK(숫자지만 문자열로 직렬화된다).
        name: { type: string }
        contactName:
          type: string
          description: 담당자명. 미입력이면 빈 문자열.
        contactPhone:
          type: string
          description: 담당자 연락처. 미입력이면 빈 문자열.
        contactEmail:
          type: string
          format: email
          description: 담당자 이메일. 초대 메일 수신 주소. 서버가 소문자로 정규화해 저장한다.
        active:
          type: boolean
          description: |
            사용 가능/불가(S2-A1 토글). false면 이 여행사 계정으로 여행사앱 로그인·예약이
            차단된다.
        accountRegistered:
          type: boolean
          description: 담당자가 초대 링크로 아이디·비밀번호를 설정했는지(S2-G1 완료 여부).
        loginId:
          type: [string, 'null']
          description: 등록된 계정의 아이디. `accountRegistered` 가 false면 null.
        invitationStatus: { $ref: '#/components/schemas/AgencyInvitationStatus' }
        invitationExpiresAt:
          type: [string, 'null']
          format: date-time
          description: 최신 초대의 만료 시각(UTC). `PENDING`·`EXPIRED` 일 때만 값이 있다.
        deleted:
          type: boolean
          description: 소프트 삭제 여부. 복원 API는 없다.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt:
          type: [string, 'null']
          format: date-time
          description: 소프트 삭제 시각. `deleted` 가 false면 null.

    AgencyCreateRequest:
      type: object
      required: [name, contactEmail]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 여행사 명칭. 서버가 앞뒤 공백을 제거한 뒤 저장·중복검사한다.
        contactName: { type: string, maxLength: 50 }
        contactPhone: { type: string, maxLength: 30 }
        contactEmail:
          type: string
          format: email
          maxLength: 255
          description: |
            담당자 이메일. 초대 메일이 이 주소로 나간다.

            **중복을 허용한다** — 한 담당자가 여러 여행사를 맡을 수 있고, 초대 토큰은
            이메일이 아니라 여행사 PK에 묶이므로 링크가 서로 섞이지 않는다.

    AgencyUpdateRequest:
      type: object
      required: [name, contactEmail]
      description: |
        생성 요청과 필드가 같다. `active` 는 여기 없다 — 전용 엔드포인트
        (`PATCH .../active`)로 다룬다.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        contactName: { type: string, maxLength: 50 }
        contactPhone: { type: string, maxLength: 30 }
        contactEmail: { type: string, format: email, maxLength: 255 }

    AgencyActiveRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }

    AgencyInvitationResult:
      type: object
      required: [sent]
      description: |
        초대 발송 시도의 결과. **메일 실패를 에러 응답으로 만들지 않기 위한 스키마다** —
        여행사 등록 자체는 성공했는데 SMTP만 죽은 상황을 화면이 구분할 수 있어야 한다.
      properties:
        sent:
          type: boolean
          description: 메일을 실제로 보냈는지. false면 `skippedReason` 을 본다.
        skippedReason:
          type: [string, 'null']
          enum: [MAIL_SEND_FAILED, MAIL_DISABLED, 'null']
          description: |
            - `MAIL_SEND_FAILED` — SMTP 오류. 재발송으로 다시 시도할 수 있다.
            - `MAIL_DISABLED` — 서버 설정(`chinguya.mail.enabled=false`)으로 발송을 끈
              환경(로컬 개발). 초대 토큰 자체는 정상 발급됐고 링크는 서버 로그에 찍힌다.
            `sent` 가 true면 null.
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: 발급된 초대의 만료 시각(UTC, 발급 +7일). 발급 자체가 없었으면 null.

    AgencyCreateResponse:
      type: object
      required: [agency, invitation]
      properties:
        agency: { $ref: '#/components/schemas/Agency' }
        invitation: { $ref: '#/components/schemas/AgencyInvitationResult' }

    AdminBookingTab:
      type: string
      enum: [RECEIVED, COMPLETED, UNPAID, CANCEL_REQUESTED, CANCELLED]
      default: RECEIVED
      description: |
        예약 관리 목록(S1-A6) 탭. 접수 / 완료 / 미입금 / 취소요청 / 취소.
        `UNPAID`는 저장 상태가 아니라 '입금대기·접수 + 입금 기한 경과' 계산값이다.

    BookingStatus:
      type: string
      enum: [AWAITING_DEPOSIT, RECEIVED, COMPLETED, CANCEL_REQUESTED, CANCELLED]
      description: 고객 예약 상태. 고객 문서(chinguya-slice1-openapi.yaml)의 `BookingStatus`와 같다.

    AdminBookingSummary:
      type: object
      required: [bookingId, bookingNumber, status, unpaid, customerLoginId, passportName, productName,
                 itemCount, partiallyCancelled, useDates, activeTotalAmount, createdAt]
      properties:
        bookingId: { type: string }
        bookingNumber: { type: string, example: FR-26090001 }
        status: { $ref: '#/components/schemas/BookingStatus' }
        unpaid:
          type: boolean
          description: 입금대기·접수인데 입금 기한이 지났다('미입금' 표시).
        customerLoginId: { type: string, description: 고객 아이디 }
        passportName: { type: string, description: 예약 시점 여권 영문명 }
        productName:
          type: string
          description: |
            대표 상품명(첫 유효 항목, 유효 항목이 없으면 첫 항목). 카드 제목은
            `productName` + `itemCount`로 "전기 자전거 외 2건"을 만든다.
        itemCount:
          type: integer
          minimum: 1
          description: 총 항목 수(취소 항목 포함). "외 N건"의 N = itemCount - 1.
        partiallyCancelled:
          type: boolean
          description: 일부 항목만 취소됨 — '부분취소' 뱃지.
        useDates:
          type: array
          items: { type: string, format: date }
          description: 항목별 이용일의 합집합(오름차순).
        activeTotalAmount:
          type: integer
          description: 유효 항목 합계(KRW) = 입금액.
        depositDueBy:
          type: [string, 'null']
          format: date-time
          description: 입금 기한(생성+24시간).
        pendingCancellationId:
          type: [string, 'null']
          description: |
            처리 안 된 취소 요청 id(S1-A9 진입 키). 없으면 null. 여러 건이면 가장 먼저 요청한 것.
        createdAt: { type: string, format: date-time }

    AdminBookingListPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/AdminBookingSummary' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }

    BookingItemStatus:
      type: string
      enum: [ACTIVE, CANCEL_REQUESTED, CANCELLED]
      description: 예약 항목 상태(유효 / 취소요청 / 취소). 고객 문서의 `BookingItemStatus`와 같다.

    AdminBookingItem:
      type: object
      required: [bookingItemId, productName, optionType, dates, quantity, crossRegionReturn, lineTotal, status]
      properties:
        bookingItemId: { type: string }
        productName: { type: string, description: 예약 시점 상품명(연결 자산 명칭) }
        optionType: { $ref: '#/components/schemas/RentalOptionType' }
        dates:
          type: array
          items: { type: string, format: date }
          description: 실제 이용일(2일 옵션이면 연속 2일).
        quantity: { type: integer }
        crossRegionReturn: { type: boolean }
        lineTotal: { type: integer, description: 항목 금액(KRW) }
        status: { $ref: '#/components/schemas/BookingItemStatus' }

    AdminBookingDetail:
      type: object
      required: [bookingId, bookingNumber, status, unpaid, customerLoginId, passportName, items, totalAmount,
                 activeTotalAmount, partiallyCancelled, depositConfirmable, forceCancellable, createdAt]
      properties:
        bookingId: { type: string }
        bookingNumber: { type: string }
        status: { $ref: '#/components/schemas/BookingStatus' }
        unpaid:
          type: boolean
          description: 입금대기·접수인데 입금 기한이 지났다('미입금' 표시).
        customerLoginId: { type: string }
        passportName: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminBookingItem' }
          description: 항목 전체(취소 항목 포함, 담은 순).
        totalAmount: { type: integer, description: 원 결제액(KRW) }
        activeTotalAmount: { type: integer, description: 유효 항목 합계 = 입금액(KRW) }
        partiallyCancelled: { type: boolean }
        depositConfirmable:
          type: boolean
          description: 입금 확인 → 완료 처리를 할 수 있다(입금대기·접수).
        forceCancellable:
          type: boolean
          description: 미입금 강제 취소를 할 수 있다(= unpaid).
        depositDueBy:
          type: [string, 'null']
          format: date-time
        pendingCancellationId:
          type: [string, 'null']
          description: |
            처리 안 된 취소 요청 id(S1-A9 진입 키). 없으면 null. 여러 건이면 가장 먼저 요청한 것.
        createdAt: { type: string, format: date-time }

    AdminCancellationItem:
      type: object
      required: [bookingItemId, productName, optionType, dates, quantity, lineTotal, status, requested,
                 useDate, daysToUse, feeRate, cancellationFee, refundAmount]
      description: |
        취소 요청 화면의 항목 한 줄. 예약의 항목 **전체**를 담는다(담은 순).
        `requested=false`인 항목은 요율·금액 필드가 null이다.
      properties:
        bookingItemId: { type: string }
        productName: { type: string, description: 예약 시점 상품명 }
        optionType: { $ref: '#/components/schemas/RentalOptionType' }
        dates:
          type: array
          items: { type: string, format: date }
          description: 실제 이용일(2일 옵션이면 연속 2일).
        quantity: { type: integer }
        lineTotal: { type: integer, description: 항목 결제액(KRW) }
        status: { $ref: '#/components/schemas/BookingItemStatus' }
        requested:
          type: boolean
          description: 이 취소 요청에 담긴 항목. false면 '유지'(또는 이전 취소·다른 요청) — 흐리게.
        useDate:
          type: [string, 'null']
          format: date
          description: 요율 산정 기준 이용일(항목 시작일, JST).
        daysToUse:
          type: [integer, 'null']
          description: 요청 시점 기준 남은 일수. 화면의 'D-9'. 당일이면 0.
        feeRate:
          type: [number, 'null']
          description: 적용 요율(0~1). 요청 시점 요율표 스냅샷.
        cancellationFee:
          type: [integer, 'null']
          description: 항목 수수료(KRW) = lineTotal × feeRate, 원 단위 반올림(0.5 올림).
        refundAmount:
          type: [integer, 'null']
          description: 항목 환불 예정액(KRW) = lineTotal − cancellationFee.

    AdminCancellationDetail:
      type: object
      required: [cancellationId, bookingId, bookingNumber, bookingStatus, partiallyCancelled, customerLoginId,
                 passportName, scope, items, selectedAmount, cancellationFee, refundAmount, refundAccount,
                 requestedAt, processedAt, confirmable]
      description: 고객 취소 요청 1건(S1-A9). 금액은 모두 요청 시점 스냅샷이다.
      properties:
        cancellationId: { type: string }
        bookingId: { type: string }
        bookingNumber: { type: string, example: FR-27070003 }
        bookingStatus: { $ref: '#/components/schemas/BookingStatus' }
        partiallyCancelled: { type: boolean }
        customerLoginId: { type: string }
        passportName: { type: string }
        scope:
          type: string
          enum: [FULL, PARTIAL]
          description: 요청 당시 유효 항목 전부(`FULL`)인지 일부(`PARTIAL`)인지.
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminCancellationItem' }
          description: 예약 항목 전체. 화면의 "(2 / 3건)" = requested 개수 / 전체 개수.
        selectedAmount: { type: integer, description: 요청 항목 결제액 합계(KRW) }
        cancellationFee: { type: integer, description: '취소 수수료 합계(KRW) — 항목별 산정 후 합산' }
        refundAmount: { type: integer, description: 환불 예정액 합계(KRW) = selectedAmount − cancellationFee }
        refundAccount: { $ref: '#/components/schemas/RefundAccount' }
        reason:
          type: [string, 'null']
          description: 고객이 적은 취소 사유(선택).
        requestedAt: { type: string, format: date-time }
        processedAt:
          type: [string, 'null']
          format: date-time
          description: 취소 확정(환불 완료) 시각. 처리 전이면 null.
        confirmable:
          type: boolean
          description: 취소 확정을 할 수 있다(= processedAt이 null). 화면의 '요청 항목 취소 확정' 버튼 노출.

    RefundAccount:
      type: object
      required: [bankName, accountNumber, accountHolder]
      description: 고객이 취소 요청 때 입력한 환불 계좌. 고객 문서의 `RefundAccount`와 같다.
      properties:
        bankName: { type: string }
        accountNumber: { type: string }
        accountHolder: { type: string }

    Faq:
      type: object
      required: [faqId, question, answer, displayOrder]
      description: FAQ 한 항목(S4-A1). 분류 없이 노출 순서로만 정렬한다.
      properties:
        faqId:
          type: string
          description: FAQ PK(숫자지만 문자열로 직렬화된다).
        question: { type: string }
        answer: { type: string }
        displayOrder:
          type: integer
          description: 노출 순서(오름차순). 삭제로 번호 사이가 빌 수 있다 — 값이 아니라 순서만 의미가 있다.

    FaqRequest:
      type: object
      required: [question, answer]
      properties:
        question: { type: string, minLength: 1, maxLength: 200 }
        answer: { type: string, minLength: 1, maxLength: 2000 }

    FaqOrderRequest:
      type: object
      required: [faqIds]
      properties:
        faqIds:
          type: array
          items: { type: string }
          description: 현재 FAQ 전체 id를 원하는 노출 순서대로.

    AdminInquiry:
      type: object
      required: [inquiryId, title, content, status, customerLoginId, createdAt]
      description: 고객 1:1 문의 한 건(S4-A2). 목록·상세가 같은 모양이다.
      properties:
        inquiryId: { type: string }
        title: { type: string }
        content: { type: string }
        status:
          type: string
          enum: [WAITING, ANSWERED]
          description: 답변이 없으면 `WAITING`(대기), 있으면 `ANSWERED`(답변완료).
        customerLoginId:
          type: string
          description: 작성한 고객의 아이디(S0-C2).
        answer: { type: [string, 'null'] }
        answeredAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    InquiryAnswerRequest:
      type: object
      required: [answer]
      properties:
        answer: { type: string, minLength: 1, maxLength: 2000 }

    HeroBanner:
      type: object
      required: [slot, title, subtitle, pcImageUrl, mobileImageUrl]
      description: |
        랜딩(안 A) 히어로 배너 한 장(S4-A3). 고객앱 홈 캐러셀·여행사 로그인 배경에 쓰인다
        (그 두 화면은 아직 이 API에 연결 전 — 헤더 TODO 11).

        **이미지 주소는 두 종류다.**
        - `/content/images/{fileName}` — 이 API로 올린 이미지. 관리자는 `/admin` + 주소로 읽는다.
        - 그 밖의 `/...` — 웹앱에 들어 있는 정적 파일(초기값 `/banner-pc-1.png` 등).
      properties:
        slot:
          type: integer
          minimum: 1
          maximum: 3
          description: 배너 위치(1~3). 화면의 탭 순서.
        title:
          type: string
          description: 제목. 줄바꿈(`\n`)을 그대로 보존한다.
        subtitle:
          type: [string, 'null']
          description: 부제(선택). 비어 있으면 null.
        pcImageUrl: { type: string }
        mobileImageUrl: { type: string }

    HeroBannerInput:
      type: object
      required: [slot, title, pcImageUrl, mobileImageUrl]
      properties:
        slot: { type: integer, minimum: 1, maximum: 3 }
        title: { type: string, minLength: 1, maxLength: 100 }
        subtitle:
          type: [string, 'null']
          maxLength: 300
          description: 공백만 보내면 null로 저장한다.
        pcImageUrl:
          type: string
          maxLength: 300
          pattern: '^/[A-Za-z0-9._/-]+$'
          description: '`/` 로 시작하는 경로만 받는다(외부 주소·스크립트 주소 차단).'
        mobileImageUrl:
          type: string
          maxLength: 300
          pattern: '^/[A-Za-z0-9._/-]+$'

    HeroBannersUpdateRequest:
      type: object
      required: [banners]
      properties:
        banners:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: '#/components/schemas/HeroBannerInput' }

    ServiceIntro:
      type: object
      required: [body]
      description: 서비스 소개(S4-C2) 단일 페이지 본문.
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }

    ContentImageUploadResult:
      type: object
      required: [imageUrl]
      properties:
        imageUrl:
          type: string
          example: /content/images/3f1c2a9e-8d7b-4c6a-9e1f-2b3c4d5e6f70.png

    # --- 공지사항·이벤트 (S4-A4) ------------------------------------------------
    NoticeCategory:
      type: string
      enum: [NOTICE, EVENT]
      description: |
        **2개 고정**이다 — 관리자가 추가·수정할 수 없다. 고객 화면(S4-C6)의 탭이 이 둘에 맞춰져 있다.
        `NOTICE` = 공지사항, `EVENT` = 이벤트.

    NoticeInput:
      type: object
      required: [category, title, content, published, pinned]
      description: 등록·수정 공용. 수정은 이 값으로 **통째로 교체**한다.
      properties:
        category: { $ref: '#/components/schemas/NoticeCategory' }
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 앞뒤 공백을 뗀 뒤 비면 400.
        content:
          type: string
          minLength: 1
          maxLength: 4000
          description: |
            본문. 줄바꿈은 그대로 보존한다. 이미지는 `![설명](주소)` 표기로 글 중간에 넣는다 —
            주소는 `POST /admin/content/images` 가 돌려준 값이다. 이 표기 외의 마크다운 문법은
            해석하지 않는다(고객 화면에서 글자 그대로 보인다).

            4000자로 잡은 것은 이미지 표기가 본문 글자 수를 먹기 때문이다(한 장에 50자 안팎).
        published:
          type: boolean
          description: false 면 고객앱 목록·상세에서 빠진다. 관리자 목록에는 계속 보인다.
        pinned:
          type: boolean
          description: true 면 목록 맨 위에 붙는다. 고정끼리는 작성일 내림차순.
        eventStartDate:
          type: string
          format: date
          nullable: true
          description: |
            **이벤트에만** 쓴다. 공지사항(`NOTICE`)인데 값을 보내면 400.
            선택 입력이라 비우면 '상시'다.
        eventEndDate:
          type: string
          format: date
          nullable: true
          description: |
            종료일만 보내면 400(시작일이 있어야 한다). 시작일보다 앞서면 400.
            고객 화면은 이 날짜가 지나면 '종료'로 표시한다.
        imageUrls:
          type: array
          maxItems: 5
          description: |
            첨부 이미지 주소. 표시 순서가 배열 순서다. 생략하면 첨부 없음으로 본다.
            **업로드는 이 API 가 하지 않는다** — `POST /admin/content/images` 로 올린 뒤 그
            주소를 여기 담는다.
          items: { type: string, example: /content/images/3f1c2a9e.png }

    AdminNoticeSummary:
      type: object
      required: [noticeId, category, title, createdAt, published, pinned]
      description: 목록 카드 한 장(S4-A4). 본문·첨부는 없다 — 상세에서 받는다.
      properties:
        noticeId: { type: string, example: '12' }
        category: { $ref: '#/components/schemas/NoticeCategory' }
        title: { type: string }
        createdAt:
          type: string
          format: date
          description: 작성일. 서버가 정한 값이고 관리자가 고치지 않는다.
        published: { type: boolean }
        pinned: { type: boolean }
        eventStartDate: { type: string, format: date, nullable: true }
        eventEndDate: { type: string, format: date, nullable: true }

    AdminNoticeListPage:
      type: object
      required: [content, page, size, totalElements]
      description: 무한 스크롤이 이어 붙이는 한 페이지. 정렬은 고정 글 먼저, 그다음 작성일 내림차순.
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/AdminNoticeSummary' }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements:
          type: integer
          minimum: 0
          description: 화면이 "더 받을 게 남았는지"를 이 값과 받은 개수로 판단한다.

    AdminNoticeDetail:
      allOf:
        - $ref: '#/components/schemas/AdminNoticeSummary'
        - type: object
          required: [content, imageUrls, updatedAt]
          properties:
            content: { type: string }
            imageUrls:
              type: array
              items: { type: string }
            updatedAt: { type: string, format: date-time }

    # --- 대시보드 (S1-A1) ------------------------------------------------------
    AdminDashboard:
      type: object
      required: [today, newBookingCount, depositRequestCount, cancelRequestCount, overCapacityDates, todayVisits]
      description: S1-A1 대시보드. 저장된 문서가 아니라 예약·재고에서 집계한 값이다.
      properties:
        today:
          type: string
          format: date
          description: 서버가 정한 '오늘'(**일본 기준**). 화면은 이 값을 다시 계산하지 않는다.
        newBookingCount:
          type: integer
          minimum: 0
          description: 입금대기 예약 수(기한 내). 0 이면 화면이 큰 카드의 표정을 슬픈 쪽으로 바꾼다.
        depositRequestCount:
          type: integer
          minimum: 0
          description: 접수 예약 수(기한 내) — 고객이 입금했다고 알려 관리자 확인이 필요한 건.
        cancelRequestCount:
          type: integer
          minimum: 0
          description: 처리 안 된 취소 요청이 있는 예약 수.
        overCapacityDates:
          type: array
          description: |
            오늘 ~ +3개월 안에서 예약 초과 또는 할당 초과인 날짜. 오름차순, 중복 없음.
            비어 있으면 화면이 '재고 초과 날짜 0건'을 띄운다.
          items: { type: string, format: date }
        todayVisits:
          type: array
          description: |
            오늘(JST) 이용하는 예약. 한 예약에 항목이 여럿이고 항목마다 이용일이 다를 수 있어
            (S1-A7/A8), **취소되지 않은 항목 중 이용일이 오늘인 것이 하나라도 있는** 예약을 뽑는다.
            전 항목이 취소된 예약은 방문하지 않으므로 자연히 빠진다. 예약번호 오름차순.
          items: { $ref: '#/components/schemas/AdminDashboardVisit' }

    AdminDashboardVisit:
      type: object
      required: [bookingId, bookingNumber, productSummary, useDate, status, unpaid]
      description: 오늘 방문 예약 카드 한 장. 누르면 예약 상세(S1-A7)로 간다.
      properties:
        bookingId:
          type: string
          description: 예약 상세로 가는 키. 화면의 링크가 이 값을 쓴다.
        bookingNumber: { type: string, example: FR-26092001 }
        productSummary:
          type: string
          description: |
            카드에 한 줄로 적는 상품 요약. 항목이 여럿이면 `첫 상품명 외 N건` 이다 —
            화면이 항목 배열을 따로 받아 문자열을 조립하지 않게 서버가 만들어 준다.
          example: 전기 자전거 · 1일 외 2건
        useDate:
          type: string
          format: date
          description: 오늘 이용하는 항목의 이용일. 정의상 `today` 와 같다(화면 표기용).
        status:
          type: string
          enum: [AWAITING_DEPOSIT, RECEIVED, COMPLETED, CANCEL_REQUESTED, CANCELLED]
          description: 예약 상태. 화면의 상태 태그가 이 값과 `unpaid` 를 함께 보고 문구를 고른다.
        unpaid:
          type: boolean
          description: |
            입금 기한이 지난 건인지. 저장된 상태값이 아니라 계산 결과라, 예약 관리 목록(S1-A6)의
            `unpaid` 와 같은 규칙이다. true 면 화면이 상태 대신 '미입금' 태그를 쓴다.

    # --- 여행사 인보이스 (S2-A5/A6) -------------------------------------------
    AdminInvoiceList:
      type: object
      required: [invoices, pending]
      description: |
        S2-A5 목록 응답. 발행된 것과 아직 발행 전인 이번 달을 **나눠서** 준다 —
        발행 전 건은 id·발행일·정산 상태가 없어서 같은 배열에 섞으면 화면이
        매번 null 을 확인해야 한다.
      properties:
        invoices:
          type: array
          description: 발행된 인보이스. 최근 월 먼저, 같은 월이면 여행사명 오름차순.
          items: { $ref: '#/components/schemas/AdminInvoiceSummary' }
        pending:
          type: array
          description: |
            아직 발행 전인 **이번 달** 사용액. 사용 가능(`active`) 여행사마다 1건이며,
            대상 예약이 없으면 `amount` 가 0 이다(줄 자체는 준다 — 화면이 여행사 목록을
            따로 부르지 않아도 되도록).
          items: { $ref: '#/components/schemas/AdminInvoicePending' }

    AdminInvoiceSummary:
      type: object
      required: [invoiceId, agencyId, agencyName, period, issuedAt, amount, settled]
      description: 발행된 인보이스 1건. 카드 한 장에 대응한다.
      properties:
        invoiceId: { type: string, example: '12' }
        agencyId: { type: string, example: '1' }
        agencyName: { type: string, example: 제주바다여행사 }
        period:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: '2026-08'
          description: 대상 월.
        issuedAt:
          type: string
          format: date
          example: '2026-09-01'
          description: 발행일. 대상 월 다음 달 1일이다.
        amount:
          type: integer
          minimum: 0
          description: 정산 반영액 합계(상세의 `totalAmount` 와 같은 값).
        settled:
          type: boolean
          description: 정산(입금) 완료 여부. 화면의 `정산완료`/`미정산` 태그.

    AdminInvoicePending:
      type: object
      required: [agencyId, agencyName, period, amount]
      description: |
        아직 발행되지 않은 이번 달 사용액. **id 가 없다** — 저장된 인보이스가 아니라
        집계값이라서다. 그래서 상세(S2-A6)로 들어갈 수 없고, 화면도 링크로 만들지 않는다.
      properties:
        agencyId: { type: string, example: '1' }
        agencyName: { type: string, example: 제주바다여행사 }
        period:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: '2026-09'
          description: 이번 달. 서버가 정한다.
        amount:
          type: integer
          minimum: 0
          description: |
            현재까지의 정산 반영액. **아직 확정이 아니다** — 이 달 예약은 아직 취소될 수
            있어서 발행일까지 값이 움직인다.

    AdminInvoiceDetail:
      type: object
      required: [invoiceId, agencyId, agencyName, period, issuedAt, currency, lineItems, totalAmount, settled, settleable]
      description: S2-A6 상세. 라인아이템은 저장돼 있지 않고 예약에서 집계한 값이다.
      properties:
        invoiceId: { type: string, example: '12' }
        agencyId: { type: string, example: '1' }
        agencyName: { type: string, example: 제주바다여행사 }
        period:
          type: string
          pattern: '^\d{4}-\d{2}$'
          example: '2026-08'
        issuedAt: { type: string, format: date, example: '2026-09-01' }
        currency:
          type: string
          enum: [KRW]
          description: KRW 고정. 세금 라인은 없다.
        lineItems:
          type: array
          description: 이용일 오름차순, 같은 날은 예약번호 오름차순(S2-G7 과 같은 정렬).
          items: { $ref: '#/components/schemas/AdminInvoiceLineItem' }
        totalAmount:
          type: integer
          minimum: 0
          description: |
            화면의 '합계(정산 반영액)'. **완료 예약 금액 합 + 취소 예약의 취소 수수료 합**이다.
            여행사 인보이스(S2-G7)의 `totalAmount` 와 같은 값이라 두 화면이 어긋나지 않는다.
        settled:
          type: boolean
        settledAt:
          type: string
          format: date-time
          nullable: true
          description: 정산 확인 시각. 미정산이면 null.
        settleable:
          type: boolean
          description: |
            '입금 확인' 버튼을 띄울지. 지금은 `settled == false` 와 같지만, 화면이 상태를
            해석하지 않도록 서버가 내려준다(S1-A7 `depositConfirmable` 과 같은 관례).
            STAFF 에게도 true 로 내려간다 — 버튼 숨김은 화면이 권한으로 따로 판단하고,
            최종 차단은 서버 403 이다.

    AdminInvoiceLineItem:
      type: object
      required: [useDate, reservationNumber, assetName, optionType, quantity, unitPrice, status, amount]
      description: |
        완료 또는 취소 예약 1건. 여행사 인보이스(S2-G7)의 `AgencyInvoiceLineItem` 과
        같은 모양이다 — 같은 집계를 두 화면이 나눠 보는 것이라 일부러 맞췄다.
      properties:
        useDate: { type: string, format: date }
        reservationNumber: { type: string, example: AG-26080001 }
        assetName: { type: string }
        optionType:
          type: string
          enum: [HOURS_2, DAY_1, DAY_2, NIGHT]
        quantity: { type: integer, minimum: 1 }
        unitPrice:
          type: integer
          minimum: 0
          description: 예약 시점 여행사가 스냅샷(KRW).
        status:
          type: string
          enum: [COMPLETED, CANCELLED]
        amount:
          type: integer
          minimum: 0
          description: |
            정산 반영액. `COMPLETED` 면 `unitPrice × quantity`, `CANCELLED` 면
            **취소 수수료**(취소 시점 스냅샷)다. 화면의 '예약 금액 반영'/'취소 수수료만 반영'
            문구가 이 갈림을 그대로 쓴다.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            도메인 에러 코드.

            인증(S0-A2):
            - `INVALID_CREDENTIALS` — 아이디 없음 또는 비밀번호 불일치(둘을 구분하지 않는다).

            관리자 계정(S0-A5/A6):
            - `ADMIN_NOT_FOUND` — 존재하지 않거나 삭제된 관리자 계정.
            - `DUPLICATE_LOGIN_ID` — 같은 아이디의 계정이 이미 있다(삭제된 계정 포함).
            - `LAST_SUPER_ADMIN` — 마지막 슈퍼어드민을 STAFF로 내리거나 삭제하려 했다.

            자산(S1-A2):
            - `ASSET_NOT_FOUND` — 존재하지 않는 자산.
            - `DUPLICATE_ASSET_NAME` — 같은 명칭의 활성 자산이 이미 있다.
            - `ASSET_DELETED` — 삭제된 자산은 수정할 수 없다.
            - `ASSET_ALREADY_DELETED` — 이미 소프트 삭제된 자산을 또 삭제하려 했다.
            - `ASSET_NOT_DELETED` — 삭제 상태가 아닌 자산을 복원하려 했다.

            재고 세팅(S1-A3):
            - `ADJUSTMENT_NOT_FOUND` — 존재하지 않는 재고 조정.
            - `ALLOCATION_EXCEEDS_STOCK` — 여행사 할당 합이 총 보유를 넘는 날짜가 생겨 저장하지 않았다.
            - `AGENCY_NOT_FOUND` — 할당 대상 여행사가 없거나 삭제됐다.

            여행사(S2-A1/A2/A3):
            - `AGENCY_NOT_FOUND` — 존재하지 않거나 삭제된 여행사.
            - `DUPLICATE_AGENCY_NAME` — 같은 명칭의 활성 여행사가 이미 있다.
            - `AGENCY_DELETED` — 삭제된 여행사는 수정·상태변경·재발송할 수 없다.
            - `AGENCY_ALREADY_DELETED` — 이미 삭제된 여행사를 또 삭제하려 했다.
            - `AGENCY_ACCOUNT_ALREADY_EXISTS` — 이미 계정이 등록돼 재발송할 수 없다.

            예약 관리(S1-A6~A8):
            - `BOOKING_NOT_FOUND` — 존재하지 않는 예약.
            - `INVALID_BOOKING_STATUS` — 입금확인은 입금대기·접수에서만, 강제 취소는 미입금에서만 된다.

            취소요청 처리(S1-A9):
            - `CANCELLATION_NOT_FOUND` — 존재하지 않는 취소 요청.
            - `CANCELLATION_ALREADY_PROCESSED` — 이미 확정한 취소 요청을 또 확정하려 했다.

            공지사항·이벤트 관리(S4-A4):
            - `NOTICE_NOT_FOUND` — 존재하지 않는 글.
            - `VALIDATION_ERROR` — 제목·본문 길이, 공지사항에 이벤트 기간, 종료일만 보냄,
              시작일 > 종료일, 첨부 5장 초과.

            여행사 인보이스(S2-A5/A6):
            - `INVOICE_NOT_FOUND` — 존재하지 않는 인보이스.
            - `INVOICE_ALREADY_SETTLED` — 이미 정산 완료된 인보이스를 또 확인하려 했다.

            FAQ·콘텐츠 관리(S4-A1/A3):
            - `FAQ_NOT_FOUND` — 존재하지 않는 FAQ.
            - `FAQ_ORDER_MISMATCH` — 순서 변경 요청의 id 묶음이 현재 FAQ 전체와 다르다.
            - `INVALID_BANNERS` — 배너 slot 1·2·3이 하나씩 있지 않다.
            - `INVALID_IMAGE` — PNG·JPG·WEBP가 아닌 파일.
            - `IMAGE_TOO_LARGE` — 10MB 초과(413).
            - `CONTENT_IMAGE_NOT_FOUND` — 없는 이미지 파일.
        message: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              reason: { type: string }

