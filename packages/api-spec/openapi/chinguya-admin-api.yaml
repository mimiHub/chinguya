      summary: FAQ 삭제 (S4-A1)
      description: 완전 삭제다(복원 없음). 남은 항목의 순서는 그대로 유지된다.
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FaqNotFound'

  /admin/faqs/order:
    put:
      tags: [admin-faq]
      x-screens: [S4-A1]
      summary: FAQ 노출 순서 변경 (S4-A1)
      description: |
        **전체 FAQ id를 원하는 순서대로** 보낸다. 서버는 받은 순서대로 1부터 다시 매기고
        새 목록을 돌려준다.

        보낸 id 묶음이 현재 FAQ 전체와 정확히 같아야 한다(빠짐·추가·중복 없음). 다르면
        그 사이 다른 관리자가 등록·삭제한 것이므로 409 `FAQ_ORDER_MISMATCH` — 화면은
        목록을 새로 불러와야 한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FaqOrderRequest' }
      responses:
        '200':
          description: 순서가 바뀐 FAQ 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Faq' }
        '400':
          description: faqIds 누락(`VALIDATION_ERROR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 보낸 id 묶음이 현재 FAQ 전체와 다르다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: FAQ_ORDER_MISMATCH
                message: FAQ 목록이 바뀌었습니다. 새로고침 후 다시 시도해 주세요.

  /admin/inquiries:
