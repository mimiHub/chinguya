openapi: 3.1.0

# =============================================================================
# 친구야 — 관리자 대상 Core API 명세 [v0.1]
#
# 2026-09-21 변경(대시보드 S1-A1 — 스펙 선행):
#   1. `GET /admin/dashboard` 신설. 지표 3개·재고 초과 날짜·오늘 방문 예약을 한 번에 준다.
#   2. **지표 3개를 입금 단계로 가른다** — 신규 예약 = 입금대기, 입금확인 요청 = 접수(고객이
#      입금했다고 알린 건), 취소요청 = 미처리 취소 요청. 와이어프레임이 기준을 정하지 않아
#      여기서 정했다. 셋이 겹치지 않고, 입금 기한이 지난 건은 앞의 둘에서 뺀다(미입금 탭 소관).
#   3. **재고 초과 집계를 서버로 옮긴다.** 화면이 자산 목록을 받아 자산×월마다 스냅샷을 부르던
#      것을 한 번의 호출로 바꾼다. 범위도 이번 달·다음 달에서 **오늘 ~ +3개월**로 넓혔다
#      (예약 가능 기간과 같은 범위).
#
# 범위: 관리자 인증(S0-A2 로그인), 관리자 계정 관리(S0-A5/A6), 대시보드(S1-A1), 자산 관리(S1-A2),
#       날짜별 재고 세팅(S1-A3, 여행사 할당 포함),
#       여행사 관리(S2-A1/A2/A3), FAQ·콘텐츠 관리(S4-A1/A3), 예약 관리 목록·상세·
#       입금확인·미입금 강제취소(S1-A6/A7/A8), 취소요청 처리(S1-A9),
#       여행사 인보이스(S2-A5/A6), 공지사항·이벤트 관리(S4-A4).
#
# 2026-09-21 변경(여행사 인보이스 S2-A5/A6 — 스펙 선행):
#   1. `GET /admin/invoices`·`GET /admin/invoices/{invoiceId}`·
#      `POST /admin/invoices/{invoiceId}/settle` 신설.
#   2. 인보이스는 **헤더만 저장**한다(여행사·대상월·발행일·정산일). 라인아이템과 금액은
#      `agency_reservation` 에서 매번 집계한다 — S2-G7 이 이미 쓰는 방식이라 여행사가 보는
#      합계와 관리자가 보는 합계가 구조적으로 같아진다.
#   3. **취소 예약도 인보이스 라인에 넣고, 금액은 취소 수수료로 반영**한다
#      (와이어프레임 a-invoicedetail: "합계 = 완료 예약 금액 합 + 취소 예약의 취소 수수료 합").
#      이 결정에 맞춰 chinguya-agency-api.yaml 의 S2-G7 도 함께 고쳤다 — 예전에는 취소를
#      아예 빼고 줬다. 수수료율은 고객과 공용(`cancellation_policy`)이고, 금액은 **취소
#      시점에 예약 행에 박는 스냅샷**(`agency_reservation.cancel_fee`)이라 요율을 나중에
#      바꿔도 지난 인보이스가 흔들리지 않는다.
#
# 2026-09-21 변경(문의 관리 S4-A2-1/A2-2 — 고객 질문하기 S4-C5 실연동과 함께):
#   1. `GET /admin/inquiries`·`GET /admin/inquiries/{inquiryId}`·`PUT /admin/inquiries/{inquiryId}/answer` 신설.
#   2. 조회는 관리자 누구나, 답변 등록·수정은 슈퍼어드민만(403). 고객 쪽 본인 글 잠금은 관리자에게 적용하지 않는다.
#   3. 답변은 질문당 하나 — 다시 보내면 덮어쓴다(답변 수정). 카카오 알림톡은 첫 등록 때만, 실발송은 이연(로그만).
#
# 2026-09-18 변경(취소요청 처리 S1-A9 — 스펙 선행, 백엔드 미구현):
#   1. `GET /admin/cancellations/{cancellationId}`·`POST /admin/cancellations/{cancellationId}/confirm` 신설.
#      화면 단위 = **고객 취소 요청 1건**(DB `cancellation`). 한 예약에 요청이 여러 건 생길 수 있어서다
#      (완료 예약은 항목을 골라 나눠서 요청할 수 있다).
#   2. 금액은 **고객이 요청한 시점의 견적 스냅샷**(`cancellation_item`)을 그대로 쓴다. 확정 시 다시 계산하지 않는다.
#   3. `AdminBookingSummary`·`AdminBookingDetail`에 `pendingCancellationId` 추가 — 목록·상세에서 S1-A9로 가는 키.
#   4. 탭 `CANCEL_REQUESTED`의 뜻을 바꾼다: 상태가 `CANCEL_REQUESTED`인 예약 → **처리 안 된 취소 요청이 있는 예약**.
#      부분 취소 요청은 예약 상태를 유지하므로(고객 문서 v0.4) 옛 규칙으로는 이 탭에 안 잡혔다.
#      부분 요청 예약은 원래 상태 탭(예: 완료)과 취소요청 탭 **양쪽에** 보인다.
#
#       여행사 **대상** 계약(여행사 담당자가 쓰는 초대 수락·로그인, S2-G1/G2)은
#       chinguya-agency-api.yaml 에 따로 있다. 이 문서는 관리자가 부르는 것만 담는다.
#
# 고객 대상 계약은 chinguya-slice1-openapi.yaml 에 따로 있다. 그 문서는 헤더에서
# 스스로를 '고객 대상 Core API'로 한정하므로 관리자 계약은 이 파일로 분리한다.
#
# x-screens: 각 operation에 이 확장 필드로 **그 엔드포인트를 쓰는 화면코드**를 단다.
#            노션 「페이지 정의서」의 `API 상태` 를 어느 행에 찍을지 이 값으로만 판단한다
#            (주석·summary로 추정하지 않는다 — chinguya-api/CLAUDE.md).
#            값은 와이어프레임 원본 화면코드다. 여러 화면이 쓰면 모두 적고,
#            로그아웃·세션조회처럼 특정 화면에 귀속되지 않는 공통 엔드포인트는 `[]` 다.
#            **새 operation을 추가하면 x-screens도 함께 단다.**
# 아키텍처: 관리자 앱(Next.js)은 자체 Route Handler(BFF)를 거쳐 이 Core API를
#           호출한다. Core가 내려준 JWT를 BFF가 자기 오리진 쿠키로 다시 심는다
#           (Core에는 CORS 설정이 없고 쿠키가 SameSite=Lax라 브라우저 직접 호출 불가).
#
# ⚠ 이 문서는 **구현을 역문서화**한 것이다. 통상은 스펙이 먼저이지만(README 참고),
#   관리자 인증은 백엔드(chinguya-api)에 먼저 구현됐다. 아래 내용은 구현
#   (admin/auth/AdminAuthController.java, security/SecurityConfig.java,
#   security/JwtTokenProvider.java)과 1:1로 맞춰 적었다. 이후 변경은 이 문서를
#   먼저 고치는 정상 순서로 돌아간다.
#
# 미확정(TODO 협의):
#   1. AdminSessionResponse 에 **표시 이름(name) 필드가 없다.** 화면(S0-A2 이후
#      공통 헤더 드로어)은 지금 loginId 만 보여줄 수 있다. 이름을 노출하려면
#      admin_account 에 컬럼 추가 + 이 응답 확장이 필요하다.
#   2. **S0-A1(슈퍼어드민 최초 생성) 플로우가 없다.** 현재는 마이그레이션
#      V3__admin_auth.sql 의 임시 시드 계정으로 대체 중이며, 그 파일 주석도
#      운영 배포 전 교체를 경고하고 있다.
#   3. (해결됨) 관리자 계정 CRUD(S0-A5/A6) API가 생겼다. 단, 토큰이 stateless라 **등급을
#      내리거나 계정을 삭제해도 그 사람이 이미 받은 토큰은 만료(최대 4시간)까지 이전 등급으로
#      동작한다.** 즉시 끊으려면 요청마다 계정을 다시 읽어야 한다 — 아직 하지 않는다.
#   4. 토큰 만료(4시간) 시 UX가 미정 — 자동 갱신(리프레시 토큰)인지 재로그인인지.
#      갱신 엔드포인트는 아직 없다.
#   5. 로그인 실패 횟수 제한·계정 잠금 정책 없음.
#   6. (해결됨) 자산 삭제의 소프트/하드 분기 기준인 '날짜별 재고 레코드' 테이블(S1-A3)이
#      생겼다. `Asset.hasInventoryRecords` 는 이제 실제 재고 레코드(기준 보유량 이력 또는
#      재고 조정) 유무를 반환하고, DELETE 는 그 값에 따라 HARD/SOFT를 실제로 가른다.
#   7. **"예약(reserved)" 수량은 아직 없다.** 고객 예약(S1-A6~A9)이 DB·백엔드 모두
#      미착수라, 날짜별 재고 세팅 API의 `reserved` 필드는 예약 시스템이 생기기 전까지
#      항상 0으로 내려간다 — 그래서 "초과 경고"(A3-M3)용 미리보기 엔드포인트도 항상
#      빈 배열을 반환한다. 예약 시스템이 생기면 서버의 계산 한 곳만 채우면 되고
#      응답 계약은 그대로다.
#   8. (해결됨) 여행사 예약(S2-G4/G5, 여행사 문서)이 생겼다. 여행사 예약 마감(이용일 D-3)이
#      지난 날짜는 "안 팔린 할당은 고객 가용으로 반환" 규칙대로 그 여행사의 실제 예약
#      수량(완료 상태)만 고객 가용에서 빠진다. 응답 계약은 그대로다.
#      ⚠ 할당을 줄이는 쓰기(A3-M4·할당 조정)는 이미 잡힌 여행사 예약보다 적게 줄이는 것을
#      아직 막지 않는다.
#  10. **업로드했지만 저장하지 않은 이미지는 지워지지 않는다**(S4-A3). 화면은 '배너 저장'을
#      누를 때만 올려서 줄이지만, 올린 뒤 저장이 실패하면 파일이 남는다. 정리 작업은 없다.
#  11. **고객·여행사 쪽 공개 조회 API가 아직 없다.** 고객 FAQ(S4-C3)·홈 배너·서비스 소개(S4-C2)와
#      여행사 로그인 배경(S2-G1/G2)은 여전히 목 데이터를 읽는다 — 그래서 여기서 저장해도 아직
#      그 화면들엔 반영되지 않는다. 연결할 때 `/v1` 쪽에 조회 API와 이미지 공개 경로를 만든다.
#  12. **이미지는 EC2 로컬 디스크에 저장한다**(`CONTENT_IMAGE_DIR`). 인스턴스를 새로 만들면
#      사라지고, 서버를 2대 이상으로 늘리면 쓸 수 없다 — 그때는 S3 등으로 옮겨야 한다.
# =============================================================================

info:
  title: 친구야 관리자 Core API
  version: 0.1.0
  description: |
    관리자(A) 앱이 쓰는 Core API 계약. 현재는 인증(S0-A2), 관리자 계정 관리(S0-A5/A6), 자산 관리(S1-A2), 날짜별
    재고 세팅(S1-A3 — 여행사 할당 포함, 구 S2-A4 흡수), 여행사 관리(S2-A1/A2/A3),
    FAQ·콘텐츠 관리(S4-A1/A3)를 정의한다.

    **권한 모델** — 서버가 강제한다(SecurityConfig):
    - `/admin/**` 는 전부 쿠키 인증 필수(로그인 엔드포인트만 예외). 미인증 시 401.
    - 쓰기 메서드(POST·PUT·PATCH·DELETE)는 **SUPER_ADMIN만** 허용. STAFF가 시도하면 403.
    - 조회(GET)는 인증된 관리자면 누구나.

    즉 '일반 관리자는 조회 전용, 쓰기는 슈퍼어드민'(와이어프레임 공통 규칙)은
    프론트 UI가 아니라 **서버가 최종 강제**한다. 프론트의 버튼 숨김은 정합성을
    맞추는 것일 뿐 보안 경계가 아니다.

servers:
  - url: https://api.chinguya.co.kr
    description: 운영(prod)
  - url: http://localhost:8080
    description: 로컬 개발

# ⚠ 고객 문서(slice1)의 서버 URL에는 `/v1` 프리픽스가 붙지만 관리자 컨트롤러에는
#   없다(@RequestMapping("/admin/auth")). 경로를 그대로 복사하지 말 것.

tags:
  - name: admin-auth
    description: 관리자 로그인·로그아웃·세션 조회 (S0-A2)
  - name: admin-account
    description: 관리자 계정 목록·등록·수정(등급·비밀번호)·삭제 (S0-A5/A6)
  - name: admin-asset
    description: 자산(명칭 마스터) 등록·수정·삭제·복원 (S1-A2)
  - name: admin-inventory
    description: 자산별 날짜별 재고 세팅 — 기준 보유량·여행사 할당·재고 조정·매장 휴무 (S1-A3)
  - name: admin-product
    description: 상품(연결 자산 × 대여 옵션) 목록·등록·수정·삭제·표출 토글 (S1-A4/A5)
  - name: admin-agency
    description: 여행사(거래처) 목록·등록(초대)·상세·사용 가능/불가 (S2-A1/A2/A3)
  - name: admin-booking
    description: 고객 예약 관리 — 목록·검색·상세·입금확인·미입금 강제취소 (S1-A6/A7/A8)
  - name: admin-cancellation
    description: 고객 취소요청 처리 — 요청 항목 검토·환불 후 취소 확정 (S1-A9)
  - name: admin-faq
    description: FAQ 등록·수정·삭제·노출 순서 (S4-A1)
  - name: admin-inquiry
    description: 고객 1:1 문의 목록·상세·답변 (S4-A2-1/A2-2)
  - name: admin-content
    description: 랜딩 히어로 배너·서비스 소개 본문·이미지 업로드 (S4-A3)

# -----------------------------------------------------------------------------
paths:

  /admin/auth/login:
    post:
      tags: [admin-auth]
      x-screens: [S0-A2]
      summary: 관리자 로그인 (S0-A2)
      description: |
        아이디·비밀번호로 인증하고 액세스 토큰(JWT)을 **HttpOnly 쿠키로** 발급한다.
        비밀번호는 BCrypt 해시와 대조한다.

        아이디가 없는 경우와 비밀번호가 틀린 경우 모두 **같은 401
        (`INVALID_CREDENTIALS`)** 로 응답한다 — 계정 존재 여부가 새지 않게.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: |
                `admin_access_token=<JWT>; HttpOnly; SameSite=Lax; Path=/; Max-Age=<4시간>`
                `Secure` 는 환경변수(ADMIN_COOKIE_SECURE)로 결정된다 — 운영은 반드시 true.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSessionResponse' }
        '400':
          description: loginId·password 누락(검증 실패)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/InvalidCredentials'

  /admin/auth/logout:
    post:
      tags: [admin-auth]
      x-screens: []
      summary: 관리자 로그아웃
      description: 액세스 토큰 쿠키를 Max-Age=0 으로 만료시킨다. 서버는 stateless라 토큰 폐기 목록은 두지 않는다.
      responses:
        '204':
          description: 로그아웃 완료
          headers:
            Set-Cookie:
              description: '`admin_access_token=; Max-Age=0` (쿠키 삭제)'
              schema: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/auth/me:
    get:
      tags: [admin-auth]
      x-screens: []
      summary: 현재 로그인 세션 조회
      description: |
        쿠키의 JWT를 검증해 현재 관리자 정보를 돌려준다. 화면 재진입·새로고침 때
        '내가 누구이고 슈퍼어드민인지'를 확인하는 용도.
      responses:
        '200':
          description: 유효한 세션
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSessionResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/admins:
    get:
      tags: [admin-account]
      x-screens: [S0-A5]
      summary: 관리자 계정 목록 (S0-A5)
      description: |
        삭제되지 않은 계정을 등록 순서대로 돌려준다. 계정 수가 적어 페이지네이션은 없다.
        조회는 STAFF도 할 수 있다(다른 조회 API와 같은 규칙).
      responses:
        '200':
          description: 관리자 계정 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminAccount' }
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [admin-account]
      x-screens: [S0-A6]
      summary: 관리자 계정 등록 (S0-A6)
      description: |
        비밀번호는 BCrypt 해시로만 저장한다. 아이디는 **삭제된 계정의 것도 다시 쓸 수 없다**
        (소프트 삭제라 행이 남고, 아이디 유니크가 전체 행에 걸려 있다).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAccountCreateRequest' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccount' }
        '400':
          description: 아이디·비밀번호 형식 오류 또는 등급 누락(`VALIDATION_ERROR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateLoginId'

  /admin/admins/{adminId}:
    parameters:
      - name: adminId
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [admin-account]
      x-screens: [S0-A6]
      summary: 관리자 계정 수정 (S0-A6)
      description: |
        등급을 바꾸고, `password` 를 보냈을 때만 비밀번호도 바꾼다(생략·null = 그대로).
        아이디는 바꿀 수 없다.

        **마지막 슈퍼어드민은 STAFF로 내릴 수 없다**(409 `LAST_SUPER_ADMIN`) — 쓰기 권한을
        가진 사람이 아무도 남지 않기 때문이다.

        ⚠ 등급을 내려도 그 사람이 이미 받은 토큰은 만료(최대 4시간)까지 이전 등급으로 동작한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminAccountUpdateRequest' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccount' }
        '400':
          description: 비밀번호 형식 오류 또는 등급 누락(`VALIDATION_ERROR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '409':
          $ref: '#/components/responses/LastSuperAdmin'

    delete:
      tags: [admin-account]
      x-screens: [S0-A5, S0-A6]
      summary: 관리자 계정 삭제 (S0-A5/A6)
      description: |
        **소프트 삭제**다. 목록에서 빠지고 그 아이디로는 로그인할 수 없다(없는 계정과 같은 401).
        복원 엔드포인트는 없다. 마지막 슈퍼어드민은 삭제할 수 없다(409 `LAST_SUPER_ADMIN`).

        ⚠ 삭제해도 그 사람이 이미 받은 토큰은 만료(최대 4시간)까지 동작한다.
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AdminNotFound'
        '409':
          $ref: '#/components/responses/LastSuperAdmin'

  # ---------------------------------------------------------------------------
  # 공지사항·이벤트 관리 (S4-A4)
  #
  # 본문은 **마크다운 이미지 표기만** 해석한다(`![설명](주소)`). 굵게·목록 등 다른 문법은
  # 고객 화면에서 글자 그대로 보인다 — 에디터나 마크다운 렌더러를 새로 붙이지 않고 "글 중간
  # 이미지"만 만족시키는 최소 범위다(2026-09-21 결정).
  #
  # 첨부는 **이미지만**이고 업로드는 기존 콘텐츠 이미지 엔드포인트(`POST /admin/content/images`)를
  # 그대로 쓴다. 이 API 는 그렇게 받은 주소 목록만 저장한다 — 파일 저장소를 새로 만들지 않는다.
  # ---------------------------------------------------------------------------
  /admin/notices:
    get:
      tags: [admin-notice]
      x-screens: [S4-A4]
      summary: 공지사항·이벤트 목록 (S4-A4)
      description: |
        카테고리별 글 목록. 관리자 목록이므로 **숨긴 글도 함께** 준다(`published: false`) —
        화면이 토글로 다시 공개할 수 있어야 하기 때문이다. 고객 목록(`GET /notices`)은 공개 글만 준다.

        정렬은 **고정 글 먼저, 그다음 작성일 내림차순**(같으면 id 내림차순). 고객 화면과 같은 순서다.

        화면이 **무한 스크롤**이라 페이지를 이어 붙인다. 커서가 아니라 page·size 인 것은 예약
        관리 목록(S1-A6)과 같은 방식을 쓰기 위함이다 — 스크롤 중에 글이 새로 올라오면 경계에서
        한 건이 밀릴 수 있지만, 공지 목록은 그럴 일이 드물어 감수한다.
      parameters:
        - name: category
          in: query
          required: false
          schema: { $ref: '#/components/schemas/NoticeCategory' }
          description: 비우면 전체. 화면은 탭에 맞춰 항상 하나를 보낸다.
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 글 목록(숨긴 글 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNoticeListPage' }
        '400':
          description: 카테고리 값이 올바르지 않거나 page·size 범위를 벗어났다(`VALIDATION_ERROR`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [admin-notice]
      x-screens: [S4-A4]
      summary: 공지사항·이벤트 등록 (S4-A4)
      description: |
        새 글을 만든다. 작성일은 **서버가 정한다**(요청에 없다) — 관리자가 날짜를 지정하거나
        고치지 않기로 했다. 슈퍼어드민 전용.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoticeInput' }
      responses:
        '201':
          description: 등록된 글
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNoticeDetail' }
        '400':
          $ref: '#/components/responses/InvalidNotice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/notices/{noticeId}:
    parameters:
      - $ref: '#/components/parameters/NoticeIdPath'
    get:
      tags: [admin-notice]
      x-screens: [S4-A4]
      summary: 공지사항·이벤트 상세 (S4-A4)
      description: 수정 폼이 채울 값 전부. 숨긴 글도 볼 수 있다.
      responses:
        '200':
          description: 글 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNoticeDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoticeNotFound'
    put:
      tags: [admin-notice]
      x-screens: [S4-A4]
      summary: 공지사항·이벤트 수정 (S4-A4)
      description: |
        보낸 값으로 **통째로 교체**한다(부분 수정이 아니다). 첨부 이미지도 배열을 그대로 덮어쓰므로,
        한 장을 빼려면 나머지만 담아 보낸다. 작성일은 바뀌지 않는다. 슈퍼어드민 전용.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoticeInput' }
      responses:
        '200':
          description: 수정된 글
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminNoticeDetail' }
        '400':
          $ref: '#/components/responses/InvalidNotice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoticeNotFound'
    delete:
      tags: [admin-notice]
      x-screens: [S4-A4]
      summary: 공지사항·이벤트 삭제 (S4-A4)
      description: |
        **완전 삭제**다 — 복원할 수 없다(첨부 이미지 주소도 함께 지운다). 잠시 내리는 용도로는
        삭제가 아니라 `published: false` 를 쓴다.

        ⚠ 올린 **이미지 파일 자체는 서버에 남는다.** 콘텐츠 이미지 저장소에 정리 기능이 없어서다
        (S4-A3 배너도 같다). 고아 파일 정리는 별도 과제로 남겨 둔다. 슈퍼어드민 전용.
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoticeNotFound'

  /admin/dashboard:
    get:
      tags: [admin-dashboard]
      x-screens: [S1-A1]
      summary: 관리자 대시보드 (S1-A1)
      description: |
        로그인 직후 보는 화면의 세 덩어리 — **지표 3개**, **재고 초과 날짜**, **오늘 방문 예약**.

        **'오늘'은 서버가 일본 기준으로 정한다.** 예약 가능 기간·이용일 판정이 전부 JST 라
        (공통 비즈니스 규칙), 브라우저 시계를 쓰면 자정 근처에서 어제·내일 목록을 보게 된다.
        응답의 `today` 를 화면이 그대로 쓴다.

        **지표 3개는 서로 겹치지 않는다** — 입금 단계로 가른다(2026-09-21 결정).
        - `newBookingCount` — **입금대기**(`AWAITING_DEPOSIT`). 고객이 아직 '입금 확인 요청'을
          누르지 않은, 기다리는 건.
        - `depositRequestCount` — **접수**(`RECEIVED`). 고객이 입금했다고 알린 건이라 관리자가
          확인해줘야 한다.
        - `cancelRequestCount` — **처리 안 된 취소 요청**이 있는 예약 수(`pendingCancellationId`
          가 있는 예약). 예약 관리(S1-A6)의 취소요청 탭과 같은 규칙이라 두 숫자가 어긋나지 않는다.

        앞의 두 지표는 **입금 기한(생성 +24시간)이 지난 건을 뺀다.** 기한이 지나면 강제 취소
        대상(미입금)이라 '기다리는 예약'도 '확인해줄 입금'도 아니기 때문이다. 미입금 건은
        예약 관리의 미입금 탭에서 따로 다룬다.

        **`overCapacityDates` = 오늘부터 +3개월** 안에서 다음 둘 중 하나인 날짜다(예약 가능
        기간과 같은 범위 — 예약을 받을 수 있는 날만 본다. 지난 날짜는 손댈 수 없다).
        - 그날 예약 수가 총 보유를 넘은 날(S1-A3 에서 재고를 낮춰 생긴다)
        - 여행사 할당 합이 총 보유를 넘은 날(**할당 초과**)

        여러 자산이 같은 날 초과해도 **날짜는 한 번만** 나오고, 오름차순이다. 화면은 앞의 4개만
        보여주고 나머지는 '외 N건'으로 줄인다. 해소될 때까지 계속 내려간다.
      responses:
        '200':
          description: |
            대시보드 값. 오늘 방문 예약이 없으면 `todayVisits` 가 빈 배열이고, 초과가 없으면
            `overCapacityDates` 가 빈 배열이다(둘 다 404 가 아니다 — 화면이 '0건'·'없습니다'를 쓴다).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/assets:
    get:
      tags: [admin-asset]
      x-screens: [S1-A2]
      summary: 자산 목록 조회 (S1-A2)
      description: |
        자산 명칭 마스터 목록. 자산은 소수(현재 4종)라 페이지네이션 없이 전량 반환한다.

        정렬은 **활성 자산 먼저, 그 안에서 등록 순(id 오름차순)** 이다. 화면(S1-A2)은
        `deleted` 로 갈라 활성 자산을 위에, 삭제된 자산을 '삭제됨' 섹션으로 아래에 둔다.
      parameters:
        - name: includeDeleted
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            true 면 소프트 삭제된 자산까지 포함한다. 자산 관리 화면(S1-A2)은 '삭제됨'
            섹션을 그려야 하므로 true 로 부르고, 재고 세팅(S1-A3)의 자산 선택기처럼
            활성 자산만 필요한 곳은 기본값(false)을 쓴다.
      responses:
        '200':
          description: 자산 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Asset' }
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [admin-asset]
      x-screens: [S1-A2]
      summary: 자산 등록 (A2-M1)
      description: |
        명칭과 카테고리를 받아 자산을 만든다. 앞뒤 공백은 서버가 제거한다.

        **카테고리는 등록 때만 정한다** — 수정(PUT)에는 없고, 복원은 기존 값을 승계한다.
        연결 상품의 옵션이 카테고리를 따르기 때문에 나중에 바꿀 수 없다(S1-A2).

        중복 검사는 **활성 자산끼리만** 한다 — 소프트 삭제된 자산의 명칭은 재사용할 수
        있어서, 같은 이름이 목록에 둘 보일 수 있다(하나는 '삭제됨'). 카테고리가 달라도
        명칭이 같으면 중복이다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetCreateRequest' }
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '400':
          description: name 누락/공백만 입력, 또는 category 누락·허용값 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateAssetName'

  /admin/assets/{assetId}:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string }
        description: 자산 PK(숫자지만 문자열로 직렬화된다).

    put:
      tags: [admin-asset]
      x-screens: [S1-A2]
      summary: 자산 명칭 수정 (A2-M2)
      description: |
        명칭만 바꾼다. **카테고리는 여기서 바꿀 수 없다** — 등록 때 정한 값이 그대로
        간다(A2-M2에서 읽기 전용). **삭제됨 상태의 자산은 수정할 수 없다**(409 `ASSET_DELETED`) —
        되살리려면 복원 엔드포인트를 쓴다. 중복 검사는 등록과 같이 활성 자산끼리만 하며,
        자기 자신은 비교에서 제외한다(값을 바꾸지 않고 저장해도 409가 아니다).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetNameRequest' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '400':
          description: name 누락 또는 공백만 입력
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AssetNotFound'
        '409':
          description: |
            `DUPLICATE_ASSET_NAME` — 같은 명칭의 활성 자산이 이미 있음
            / `ASSET_DELETED` — 삭제된 자산은 수정 불가
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    delete:
      tags: [admin-asset]
      x-screens: [S1-A2]
      summary: 자산 삭제 (A2-M3)
      description: |
        **연결 상품이 1개라도 있으면 삭제할 수 없다**(409 `ASSET_HAS_PRODUCTS`, CASE 0) —
        상품을 먼저 지워야 한다. 상품이 연결 자산의 재고를 쓰기 때문이다.

        연결 상품이 없으면 **재고 레코드 유무로 처리가 갈린다** — 0건이면 완전 삭제(hard),
        1건 이상이면 소프트 삭제. 어느 쪽이 일어났는지 응답의 `deletion` 으로 알려준다
        (화면은 이 값으로 토스트 문구를 고른다).

        삭제 확인 모달의 문구 분기(CASE 0 / CASE 1 / CASE 2)는 목록 응답의
        `productCount` 와 `hasInventoryRecords` 를 보고 **삭제를 부르기 전에** 정한다.

      responses:
        '200':
          description: 삭제 완료. 어떤 방식으로 지워졌는지 반환한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDeleteResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AssetNotFound'
        '409':
          description: |
            `ASSET_HAS_PRODUCTS` — 연결 상품이 있어 삭제 불가(CASE 0, 상품 먼저 삭제)
            / `ASSET_ALREADY_DELETED` — 이미 소프트 삭제된 자산
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/assets/{assetId}/restore:
    parameters:
