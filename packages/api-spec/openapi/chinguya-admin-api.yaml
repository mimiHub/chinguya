  # ---------------------------------------------------------------------------
  # 여행사 관리 (S2-A1/A2/A3)
  #
  # 여행사와 그 로그인 계정은 별개의 생애주기를 가진다: 관리자가 여행사를 등록하면
  # 초대 메일만 나가고, 담당자가 링크로 아이디·비밀번호를 직접 정할 때 비로소 계정이
  # 생긴다(S2-G1). 그래서 이 문서에는 계정 생성 API가 없다 — 그건 여행사 대상 계약
  # (chinguya-agency-api.yaml)에 있다. 여기서 관리자가 하는 일은 여행사 마스터 관리와
  # **초대 발송**뿐이다.
  # ---------------------------------------------------------------------------

  /admin/products:
    get:
      tags: [admin-product]
      x-screens: [S1-A4]
      summary: 상품 목록 조회 (S1-A4)
      description: |
        상품 목록. 상품 수가 `활성 자산 × 옵션` 정도라 페이지네이션 없이 전량 반환한다
        (자산·여행사 목록과 같은 컨벤션).

        화면(S1-A4)은 **카테고리 탭 → 연결 자산별 묶음** 으로 그린다. 정렬은 그 구조에
        맞춰 **카테고리 · 자산 등록순 · 옵션순** 이고, 각 항목이 `assetId`·`assetName`·
        `category` 를 함께 들고 있어 클라이언트가 따로 자산을 조회하지 않아도 묶을 수 있다.
      parameters:
        - name: category
          in: query
          required: false
          schema: { $ref: '#/components/schemas/AssetCategory' }
          description: 카테고리 탭(자전거/낚싯대) 필터. 연결 자산의 카테고리 기준이다.
        - name: assetId
          in: query
          required: false
          schema: { type: string }
          description: 특정 자산의 상품만. 자산 삭제 전 연결 상품을 확인할 때 쓴다.
        - name: includeDeleted
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            true 면 소프트 삭제된 상품까지 포함한다. 화면은 삭제된 상품을 보여주지
            않으므로 기본값(false)을 쓴다.
      responses:
        '200':
          description: 상품 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [admin-product]
      x-screens: [S1-A5]
      summary: 상품 등록 (S1-A5)
      description: |
        상품 = **연결 자산 1개 + 대여 옵션 1개**. 자산 1개에 상품이 여러 개 달릴 수 있다
        (예: 전기자전거 → 1일 · 2일 · 야간).

        **연결 자산과 옵션은 등록 때만 정한다** — 수정(PUT)에서 바꾸려 하면 400
        `PRODUCT_OPTION_IMMUTABLE` 이다.

        제약:
        - 연결 자산은 **활성 자산만** 고를 수 있다(삭제된 자산이면 409 `ASSET_DELETED`).
        - 옵션은 **연결 자산의 카테고리에 맞는 것만** — 자전거 = `HOURS_2`/`DAY_1`/`DAY_2`/`NIGHT`,
          낚싯대 = `DAY_1`/`DAY_2`. 어긋나면 400 `INVALID_OPTION_FOR_CATEGORY`.
        - 같은 자산 × 같은 옵션의 **활성 상품은 1개만** (409 `DUPLICATE_PRODUCT_OPTION`).
          삭제된 조합은 재등록할 수 있다.
        - 타지역 반납 추가요금은 **2일(`DAY_2`) 상품에만** 둘 수 있다(자전거·낚싯대 모두).
          그 외 옵션에 값을 주면 400 `INVALID_CROSS_REGION_COMBO`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreateRequest' }
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: |
            `VALIDATION_ERROR` — 필수값 누락·형식 오류
            / `INVALID_OPTION_FOR_CATEGORY` — 연결 자산 카테고리에 없는 옵션
            / `INVALID_CROSS_REGION_COMBO` — 2일 상품이 아닌데 타지역 반납 추가요금을 줌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AssetNotFound'
        '409':
          description: |
            `DUPLICATE_PRODUCT_OPTION` — 같은 자산·옵션의 활성 상품이 이미 있음
            / `ASSET_DELETED` — 삭제된 자산에는 상품을 달 수 없음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }
        description: 상품 PK(숫자지만 문자열로 직렬화된다).

    get:
      tags: [admin-product]
      x-screens: [S1-A5]
      summary: 상품 상세 조회 (S1-A5)
      description: 수정 화면이 기존 값을 채우려고 부른다. 삭제된 상품도 조회된다.
      responses:
        '200':
          description: 상품 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ProductNotFound'

    put:
      tags: [admin-product]
      x-screens: [S1-A5]
      summary: 상품 수정 (S1-A5)
      description: |
        가격·표출·타지역 반납 추가요금·설명·이미지를 바꾼다. **연결 자산과 옵션은 바꿀 수
        없다** — 요청 본문에 아예 없고, 화면에서도 읽기 전용이다.

        **삭제된 상품은 수정할 수 없다**(409 `PRODUCT_DELETED`).

        이미지는 **통째로 교체**한다(부분 수정 없음) — 보낸 배열이 그대로 새 목록이 된다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdateRequest' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: '`VALIDATION_ERROR` / `INVALID_CROSS_REGION_COMBO`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: '`PRODUCT_DELETED` — 삭제된 상품은 수정 불가'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    delete:
      tags: [admin-product]
      x-screens: [S1-A5]
      summary: 상품 삭제 (A5-M1)
      description: |
        **소프트 삭제만** 한다 — 예약 이력이 상품을 참조하므로 행을 지우지 않는다.
        목록에서는 기본적으로 빠지고(`includeDeleted=false`), 같은 자산·옵션 조합을
        다시 등록할 수 있게 된다.

        자산 삭제와 달리 **복원 API는 없다**(운영 정책).
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: '`PRODUCT_ALREADY_DELETED` — 이미 삭제된 상품'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/products/{productId}/visibility:
    parameters:
      - name: productId
        in: path
        required: true
        schema: { type: string }

    patch:
      tags: [admin-product]
      x-screens: [S1-A4]
      summary: 상품 표출 토글 (S1-A4)
      description: |
        상품 목록(S1-A4)의 **고객앱 / 여행사앱 표출 토글** 전용이다. 둘은 서로 독립이라
        한쪽만 보내도 된다(보내지 않은 쪽은 그대로 둔다). 둘 다 비면 400이다.

        상품 전체를 저장하지 않고 토글만 하려고 PUT 과 분리했다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductVisibilityRequest' }
      responses:
        '200':
          description: 변경 후 상품
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '400':
          description: '`VALIDATION_ERROR` — customerVisible/agencyVisible 이 둘 다 비었음'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ProductNotFound'
        '409':
          description: '`PRODUCT_DELETED` — 삭제된 상품은 표출 변경 불가'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/bookings:
    get:
      tags: [admin-booking]
      x-screens: [S1-A6]
      summary: 예약 관리 목록 (S1-A6)
      description: |
        고객 예약(고객 문서 `Booking`)을 **탭별**로 조회·검색한다. 여행사 예약(S2-G4/G5)은
        포함하지 않는다. 관리자 목록 중 유일하게 페이지네이션한다(페이지정의서 S1-A6).

        **탭 규칙** — 예약 상태(`BookingStatus`)와 입금 기한(`depositDueBy`)으로 가른다.
        - `RECEIVED`(접수): 상태가 `AWAITING_DEPOSIT`(입금대기) 또는 `RECEIVED`(접수)이고
          입금 기한이 **아직 안 지난** 예약. 입금대기는 별도 탭 없이 카드의 상태 태그로 구분한다.
        - `UNPAID`(미입금): 상태가 `AWAITING_DEPOSIT`·`RECEIVED`인데 입금 기한(생성+24시간)이
          **지난** 예약. 저장된 상태값이 아니라 계산 결과다 — 응답의 `unpaid`가 true.
          강제 취소(S1-A8) 대상이다.
        - `COMPLETED` / `CANCELLED`: 상태가 그 값인 예약.
        - `CANCEL_REQUESTED`(취소요청): **처리 안 된 취소 요청이 있는 예약**(`pendingCancellationId`가
          null이 아님). 전체 취소 요청(상태 `CANCEL_REQUESTED`)과 부분 취소 요청(상태 유지)을 모두 잡는다.
          그래서 부분 요청 예약은 원래 상태 탭과 이 탭 양쪽에 보인다.
        - 부분취소는 탭이 아니라 `partiallyCancelled` 뱃지다(유효 항목 기준 상태의 탭에 잡힌다).

        **검색** — `keyword`가 예약번호 또는 여권 영문명에 포함(대소문자 무시)되는 예약만.
        앞뒤 공백은 무시하고, 비었으면 검색하지 않는다.

        정렬은 **최근 예약 먼저**(생성 시각 내림차순, 같으면 id 내림차순).
      parameters:
        - name: tab
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AdminBookingTab'
        - name: keyword
          in: query
          required: false
          schema: { type: string }
          description: 예약번호·여권 영문명 부분 일치(대소문자 무시).
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 예약 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBookingListPage' }
        '400':
          description: 탭 값이 올바르지 않거나 page·size 범위를 벗어났다(`VALIDATION_ERROR`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/bookings/{bookingId}:
    parameters:
      - $ref: '#/components/parameters/BookingIdPath'
    get:
      tags: [admin-booking]
      x-screens: [S1-A7]
      summary: 예약 상세 (S1-A7)
      description: |
        예약번호·고객·여권명과 **항목 리스트**(취소 항목 포함)를 반환한다. 조회 전용이며
        상태 변경은 입금확인(S1-A8) 엔드포인트로 한다. 화면은 `depositConfirmable`·
        `forceCancellable`로 버튼 노출을 가른다.
      responses:
        '200':
          description: 예약 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBookingDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/BookingNotFound'

  /admin/bookings/{bookingId}/deposit-confirm:
    parameters:
      - $ref: '#/components/parameters/BookingIdPath'
    post:
      tags: [admin-booking]
      x-screens: [S1-A8]
      summary: 입금 확인 → 완료 처리 (S1-A8)
      description: |
        입금대기(`AWAITING_DEPOSIT`) 또는 접수(`RECEIVED`) 예약을 **완료(`COMPLETED`)**로 바꾼다.
        고객이 '입금 확인 요청'을 누르기 전에 입금이 들어온 경우, 입금 기한이 지나
        '미입금'으로 표시된 뒤 늦게 입금된 경우에도 완료 처리할 수 있다.
        그 외 상태면 409 `INVALID_BOOKING_STATUS`. 슈퍼어드민 전용.
      responses:
        '200':
          description: 완료 처리된 예약
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBookingDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BookingNotFound'
        '409':
          $ref: '#/components/responses/InvalidBookingStatus'

  /admin/bookings/{bookingId}/force-cancel:
    parameters:
      - $ref: '#/components/parameters/BookingIdPath'
    post:
      tags: [admin-booking]
      x-screens: [S1-A8]
      summary: 미입금 강제 취소 (S1-A8)
      description: |
        **미입금** 예약(입금대기·접수인데 입금 기한 = 생성+24시간이 지남)을 **예약 전체 단위**로
        취소한다. 입금 전이므로 부분취소는 없다.
        - 예약 상태 → `CANCELLED`, 유효 항목 → `CANCELLED`.
        - 그 항목들의 날짜별 점유를 지워 **재고를 즉시 복원**한다.
        미입금이 아니면 409 `INVALID_BOOKING_STATUS`. 슈퍼어드민 전용.
      responses:
        '200':
          description: 강제 취소된 예약
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBookingDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/BookingNotFound'
        '409':
          $ref: '#/components/responses/InvalidBookingStatus'

  /admin/cancellations/{cancellationId}:
    parameters:
      - $ref: '#/components/parameters/CancellationIdPath'
    get:
      tags: [admin-cancellation]
      x-screens: [S1-A9]
      summary: 취소 요청 상세 (S1-A9)
      description: |
        고객 취소 요청 1건과 그 예약의 **항목 전체**를 반환한다. 진입 키는 목록·상세의
        `pendingCancellationId`다.

        - 항목 중 이 요청에 담긴 것은 `requested=true`이고 요율·수수료·환불 예정액이 채워진다.
          나머지 항목(유지·이전에 취소됨·다른 요청에 담김)은 `requested=false`, 금액 필드는 null —
          화면에서 흐리게 표시한다.
        - 금액은 **고객 요청 시점의 스냅샷**이다(`requestedAt` 기준 D-day). 조회할 때마다 다시
          계산하지 않으므로, 처리가 늦어져도 고객이 본 금액과 같다.
        - 이미 처리한 요청도 조회된다(`processedAt`이 채워지고 `confirmable=false`).
      responses:
        '200':
          description: 취소 요청 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCancellationDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CancellationNotFound'

  /admin/cancellations/{cancellationId}/confirm:
    parameters:
      - $ref: '#/components/parameters/CancellationIdPath'
    post:
      tags: [admin-cancellation]
      x-screens: [S1-A9]
      summary: 요청 항목 취소 확정 — 환불 완료 (S1-A9 · A9-M1)
      description: |
        관리자가 고객 계좌로 **수동 이체를 마친 뒤** 요청 항목을 취소로 확정한다. 슈퍼어드민 전용.
        A9-M1의 '환불 처리 했음' 입력은 화면 쪽 확인 절차라 서버로 보내지 않는다(요청 본문 없음).

        한 트랜잭션으로:
        1. 요청에 담긴 항목 `CANCEL_REQUESTED` → `CANCELLED`. 항목의 `refundAmount`·`cancelledAt`을
           채운다(고객 문서 `BookingItem`에 그대로 보인다).
        2. 그 항목들의 날짜별 점유를 지워 **요청 항목·날짜의 재고만** 즉시 복원한다.
        3. 요청의 `processedAt` = 지금.
        4. 예약 상태: 유효(`ACTIVE`)·취소요청 항목이 하나도 안 남으면 `CANCELLED`, 아니면 그대로 둔다.
           유효 항목이 남아 있으면 `partiallyCancelled=true`(부분취소 뱃지).

        이미 처리한 요청이면 409 `CANCELLATION_ALREADY_PROCESSED`.
      responses:
        '200':
          description: 확정된 취소 요청(`processedAt` 채워짐, 항목 상태 반영)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCancellationDetail' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CancellationNotFound'
        '409':
          description: 이미 확정한 취소 요청(`CANCELLATION_ALREADY_PROCESSED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/agencies:
    get:
      tags: [admin-agency]
      x-screens: [S2-A1]
      summary: 여행사 목록 조회 (S2-A1)
      description: |
        여행사(거래처) 목록. 자산과 마찬가지로 소수라 페이지네이션 없이 전량 반환한다.

        정렬은 **활성 여행사 먼저, 그 안에서 등록 순(id 오름차순)** 이다.
      parameters:
        - name: includeDeleted
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: true 면 소프트 삭제된 여행사까지 포함한다.
      responses:
        '200':
          description: 여행사 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agency' }
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [admin-agency]
      x-screens: [S2-A2]
      summary: 여행사 등록 + 초대 메일 발송 (S2-A2)
      description: |
        여행사를 만들고 담당자 이메일로 **계정 등록 초대 링크**를 보낸다. 두 일이 한
        요청인 이유는 화면(S2-A2)의 CTA가 '가입 링크 이메일 발송' 하나이기 때문이다.

        초대 링크는 여행사 웹앱의 `/login?token=…` 을 가리키며 **유효기간 7일·1회용**이다.
        토큰 원문은 서버에 저장되지 않는다(SHA-256 해시만) — 그래서 발송에 실패하면
        같은 링크를 다시 얻을 수 없고, 재발송(`POST /admin/agencies/{agencyId}/invitations`)
        으로 새 토큰을 끊어야 한다.

        **메일 발송 실패는 5xx가 아니다.** 여행사 행과 초대 행은 커밋되고 응답의
        `invitation.sent` 가 false로 내려온다 — SMTP가 죽었다고 등록 자체를 되돌리면
        관리자가 '등록이 된 건가'를 추론해야 하기 때문이다. 화면은 이 필드로 토스트를
        가르고 재발송을 안내한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgencyCreateRequest' }
      responses:
        '201':
          description: 등록 완료(메일 발송 성공 여부는 `invitation.sent` 로 판단)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgencyCreateResponse' }
        '400':
          description: 필수값 누락 또는 이메일 형식 오류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DuplicateAgencyName'

  /admin/agencies/{agencyId}:
    parameters:
      - name: agencyId
        in: path
        required: true
        schema: { type: string }
        description: 여행사 PK(숫자지만 문자열로 직렬화된다).

    get:
      tags: [admin-agency]
      x-screens: [S2-A3]
      summary: 여행사 상세 조회 (S2-A3)
      responses:
        '200':
          description: 여행사 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agency' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AgencyNotFound'

    put:
      tags: [admin-agency]
      x-screens: [S2-A3]
      summary: 여행사 정보 수정 (S2-A3)
      description: |
        명칭·담당자·연락처·이메일을 바꾼다. 사용 가능/불가는 여기가 아니라 전용
        엔드포인트(`PATCH .../active`)로 다룬다 — 목록 화면의 토글이 다른 필드를
        모르는 채로 부를 수 있어야 하기 때문이다.

        **담당자 이메일을 바꿔도 초대 메일이 자동으로 나가지 않는다.** 재발송은
        명시적 행위여야 하므로 별도 엔드포인트를 쓴다.

        삭제된 여행사는 수정할 수 없다(409 `AGENCY_DELETED`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgencyUpdateRequest' }
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agency' }
        '400':
          description: 필수값 누락 또는 이메일 형식 오류
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AgencyNotFound'
        '409':
          $ref: '#/components/responses/DuplicateAgencyName'

    delete:
      tags: [admin-agency]
      x-screens: [S2-A1]
      summary: 여행사 삭제 (S2-A1)
      description: |
        **항상 소프트 삭제**다. 자산(S1-A2)처럼 하드/소프트를 가르지 않는 이유는,
        여행사가 곧 할당(S2-A4)·예약(S2-G4~G6)·인보이스(S2-A5)에서 참조되기 때문이다 —
        지난달 인보이스가 여행사 이름을 잃으면 안 된다.

        복원 엔드포인트는 없다. 삭제된 여행사는 목록·상세·로그인에서 모두 빠지며,
        그 계정으로는 로그인할 수 없다(계정이 없는 것과 같은 401로 응답한다).
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AgencyNotFound'
        '409':
          description: 이미 삭제된 여행사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: AGENCY_ALREADY_DELETED
                message: 이미 삭제된 여행사입니다.

  /admin/agencies/{agencyId}/active:
    parameters:
      - name: agencyId
        in: path
        required: true
        schema: { type: string }

    patch:
      tags: [admin-agency]
      x-screens: [S2-A1]
      summary: 사용 가능/불가 토글 (S2-A1)
      description: |
        `active=false` 로 바꾸면 그 여행사 계정의 **로그인·예약이 차단**된다.

        ⚠ 액세스 토큰은 stateless(JWT)라 이미 발급된 토큰이 이 시점에 무효화되지는
        않는다. 대신 여행사 앱이 화면 이동마다 부르는 `GET /v1/agency/auth/me` 가
        매번 `active` 를 다시 읽어 403(`AGENCY_INACTIVE`)을 낸다 — 실질적으로는
        한 번의 화면 이동 안에 튕긴다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgencyActiveRequest' }
      responses:
        '200':
          description: 반영 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agency' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AgencyNotFound'
        '409':
          description: 삭제된 여행사는 상태를 바꿀 수 없다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: AGENCY_DELETED
                message: 삭제된 여행사는 수정할 수 없습니다.

  /admin/agencies/{agencyId}/invitations:
    parameters:
      - name: agencyId
        in: path
        required: true
        schema: { type: string }

    post:
      tags: [admin-agency]
      x-screens: [S2-A3]
      summary: 초대 메일 재발송 (S2-A3)
      description: |
        새 토큰을 끊어 담당자 이메일로 다시 보낸다. **이전에 보낸 초대 링크는 이 순간
        무효가 된다** — 여행사당 살아 있는 초대는 최대 1건이다.

        이미 계정 등록을 마친 여행사에는 보낼 수 없다(409
        `AGENCY_ACCOUNT_ALREADY_EXISTS`). 페이지정의서의 '이미 계정 있으면 발송 생략'은
        이 1:1 모델에서 **그 여행사의 계정이 이미 있을 때**를 뜻하며, 신규 등록 시점에는
        참이 될 수 없으므로 실질적으로 이 엔드포인트에서만 발동한다. 관리자가 명시적으로
        요청한 행위이므로 조용히 생략하지 않고 409로 알린다.

        메일 발송 실패는 등록과 같이 `sent: false` 로 보고한다(5xx 아님).
      responses:
        '200':
          description: 재발송 처리 완료(성공 여부는 `sent` 로 판단)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgencyInvitationResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/AgencyNotFound'
        '409':
          description: 이미 계정이 등록됐거나 삭제된 여행사
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: AGENCY_ACCOUNT_ALREADY_EXISTS
                message: 이미 계정이 등록된 여행사입니다.

  /admin/faqs:
    get:
      tags: [admin-faq]
      x-screens: [S4-A1]
      summary: FAQ 목록 (S4-A1)
      description: |
