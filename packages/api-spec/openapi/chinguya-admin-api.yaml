      summary: 현재(오늘 기준) 여행사별 기준 할당
      description: |
        삭제되지 않은 여행사 전부를 등록 순으로 돌려준다(할당이 없으면 `value` 0).
        기준 카드는 `value` > 0 인 여행사만 보여 주고, A3-M4 모달은 이 목록 전체를
