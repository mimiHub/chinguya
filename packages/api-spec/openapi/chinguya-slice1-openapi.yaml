openapi: 3.1.0

# =============================================================================
# 친구야 — Slice 1 (자전거 예약 MVP) · 고객 대상 Core API 명세 [v0.9]
#
# 범위: 고객 화면 7종 (S1-C1 상품조회 / S3-C1·S1-C2 상품 상세·예약 캘린더(통합) /
#       S1-C3 예약확인 / S1-C4 입금안내 / S1-C5 내 예약목록 /
#       S1-C6 예약 상세·바우처 / S1-C7 취소 요청)
#       + 고객 계정 (S0-C1 카카오 로그인 / S0-C2 아이디 입력 / S0-C3 세션)
#
# 아키텍처: 프론트(Next.js)는 자체 Route Handler(BFF)를 거쳐 이 Core API를
#           호출한다. JWT는 HttpOnly 쿠키로 BFF→Core에 그대로 전달된다.
#           이 문서는 Core API(api.chinguya.co.kr) 계약을 정의한다.
#
# v0.12 변경(2026-09-21 — 질문하기 S4-C4/C5 실연동):
#   1. `/inquiries` 추가 — 고객 1:1 질문. **전부 고객 로그인 필수**(비로그인 401).
#   2. 목록(`GET /inquiries`)은 전체 고객 글의 **제목·상태만** 준다. 본인 글이면 `mine: true`.
#      본문·답변은 상세(`GET /inquiries/{inquiryId}`)로만 받고, **본인 글만** 열린다.
#      남의 글·없는 글은 구분 없이 404 `INQUIRY_NOT_FOUND`(존재 여부를 흘리지 않는다).
#   3. 질문은 등록·삭제만 된다(수정 불가). 삭제도 본인 글만. 답변은 관리자 문의 관리(S4-A2)가 단다.
#
# v0.11 변경(2026-09-21 — FAQ S4-C3 실연동):
#   1. `GET /faqs` 추가 — 관리자 FAQ 관리(S4-A1)에서 등록한 FAQ를 노출 순서대로 돌려준다.
#      비로그인 열람 허용, 분류·검색·페이지네이션 없음. `x-screens: [S4-C3]`.
#
# v0.10 변경(2026-09-16 — 취소 요청 S1-C7 실연동):
#   1. `GET /bookings/{bookingId}/cancellation-quote`·`POST /bookings/{bookingId}/cancel-request`에
#      `x-screens: [S1-C7]` 부착.
#   2. 대상 항목 규칙 확정: `itemIds` 생략 = **지금 취소 가능한 항목 전부**(v0.9 항목 `cancellable`).
#      지정한 항목은 모두 취소 가능해야 한다.
#      - 예약에 없는 항목 id → 400 `INVALID_BOOKING_ITEM`
#      - 취소 불가 항목(이미 취소·취소요청, 이용일 지남) → 견적 400 / 요청 409 `ITEM_NOT_CANCELLABLE`
#      - 예약 상태가 취소 불가(취소요청·취소)거나 취소 가능한 항목이 없음 → 409 `INVALID_BOOKING_STATUS`
#   3. `FULL` = 대상이 **유효 항목 전부**. 요청이 `FULL`이면 예약 상태도 `CANCEL_REQUESTED`.
#      `FULL_ONLY`(입금대기·접수)에서 `FULL`이 아니면 409 `PARTIAL_CANCEL_NOT_ALLOWED`.
#   4. 항목 수수료 = 결제액 × 요율을 **원 단위 반올림(0.5 올림)**. `daysToUse` = 시작일 − 오늘(JST).
#   5. `RefundAccount` 각 값은 공백 불가·50자 이하 — 위반 시 400 `VALIDATION_ERROR`.
#
# v0.9 변경(2026-09-16 — 예약 상세·바우처 S1-C6 실연동):
#   1. `GET /bookings/{bookingId}`에 `x-screens` 부착. 남의 예약·없는 예약은 404 `BOOKING_NOT_FOUND`.
#   2. 취소 가능 판정 확정:
#      - 항목 `cancellable` = 항목이 `ACTIVE` + 예약이 입금대기·접수·완료 + **첫 이용일이 오늘(JST)
#        이후**(당일 포함 — 당일 취소도 요율표의 '당일' 구간으로 받는다).
#      - 예약 `cancellable` = 취소 가능한 항목이 하나라도 있다.
#      - `cancellationScope` = 완료면 `ITEM_SELECTABLE`, 입금대기·접수면 `FULL_ONLY`
#        (접수 = 고객 입금 신고만 된 상태라 입금대기와 같이 본다). 취소 불가면 null.
#   3. `BookingItem.refundAmount`·`cancelledAt`은 관리자 취소 확정(S1-A9)이 붙을 때 채운다 — 지금은 null.
#
# v0.8 변경(2026-09-16 — 내 예약 목록 S1-C5 실연동):
#   1. `GET /bookings` 정렬을 **최근 예약 먼저**(생성 시각 내림차순)로 명시하고 `x-screens` 부착.
#   2. `BookingSummary.productName` = 첫 유효 항목의 상품명(유효 항목이 없으면 첫 항목).
#      `totalAmount`는 원 결제액, 새 필드 `activeTotalAmount`는 유효 항목 합계.
#   3. 알 수 없는 `status` 값·page/size 범위 위반은 400 `VALIDATION_ERROR`.
#
# v0.7 변경(2026-09-14 — 상품 상세·예약 캘린더·장바구니·입금 안내 S1-C2~C4 실연동):
#   1. 상품 상세의 `productId`도 목록과 같은 **연결 자산 id**. `options[]` = 그 자산의
#      '표출 ON' 상품.
#   2. 가용성·점유 규칙 확정: 옵션과 무관하게 하루 단위 점유(2일 = 이틀), 야간은 재고
#      있는 날 모두 가능, 2일 + 타지역 반납은 반납 다음 날(시작일 +2)까지 같은 수량 점유.
#   3. 타지역 반납 추가요금은 **대당**: `extraFee = 대당 요금 × 수량`,
#      `lineTotal = 고객가 × 수량 + extraFee`.
#   4. `BookingCreate.passportName` 필수 표기 정정(저장값이 있으면 생략 가능). 저장값이
#      없던 고객은 이 값이 다음 예약 기본값으로 저장된다.
#   5. `DepositInfo`에 `bookingNumber`·`status` 추가 — 입금 안내(S1-C4)가 예약 상세
#      조회 없이 화면을 그린다.
#   6. S3-C1·S1-C2~C4 operation에 `x-screens` 부착, 예약 관련 에러 코드 추가.
#
# v0.6 변경(2026-09-14 — 상품 조회 S1-C1 실연동):
#   1. 상품 목록의 카드 단위를 계약에 명시: **카드 1개 = 연결 자산 1개**.
#      `ProductSummary.productId`는 자산 id이고, '표출 ON' 상품이 1개 이상인
#      자산만 온다. `priceFrom`은 그 자산의 표출 ON 상품 중 최저 고객가.
#   2. `ProductSummary.thumbnailUrl`: 형식을 `/content/images/{fileName}` 경로로
#      바꾸고(uri 아님) 없으면 null. 대표 이미지 규칙을 정했다(1일권 우선).
#   3. `GET /content/images/{fileName}` 추가 — 관리자가 올린 이미지를 고객앱이
#      비로그인으로 읽는 경로.
#   4. `GET /products`에 `x-screens` 부착.
#
# v0.5 변경(2026-09-13 — 고객 카카오 로그인 실연동):
#   1. `auth` 태그 추가: 카카오 인가 URL·카카오 로그인·가입(아이디)·세션·로그아웃.
#      로그인과 가입은 같은 카카오 로그인 엔드포인트에서 결과로 갈린다
#      (`LOGGED_IN` / `SIGNUP_REQUIRED`).
#   2. 고객 아이디 규칙 확정: 영문 소문자+숫자 4~20자, 중복 불가, 변경 불가.
#      표시·식별용이며 로그인 수단이 아니다(비밀번호 없음).
#   3. 소셜 연동은 카카오만. 네이버·구글은 `SocialProvider` 값만 남겨 둔다.
#
# v0.4 변경(2026-09-02, PM 확정 반영 — 와이어프레임 S1-C5/C6/C7 개편과 동시):
#   1. **부분취소(항목 단위 취소) 도입.** 취소 견적·취소 요청이 예약 단위에서
#      **항목 단위**로 바뀐다(`itemIds`). 근거: 취소 수수료가 '이용일 기준
#      차등 요율'인데 한 예약에 이용일이 다른 항목이 섞이므로 **예약 단위
#      일괄 산정이 성립하지 않는다**. 따라서 요율·수수료는 항목별로 산정해
#      합산한다.
#      - `CancellationQuote.feeRate` / `basedOnUseDate` **제거** →
#        `CancellationQuote.items[]`의 항목별 값으로 이동(파괴적 변경).
#   2. **부분취소는 별도 상태값·목록 탭을 만들지 않는다.** 예약 상태
#      (`BookingStatus`)는 그대로 두고 항목 상태(`BookingItemStatus`)를 새로
#      두며, 일부만 취소된 예약은 `Booking.partiallyCancelled=true` 플래그로
#      표시한다(프론트는 '부분취소' 뱃지). 예약 상태는 **유효 항목 기준**으로
#      유지한다. 입금대기·취소요청을 뱃지로 처리하는 v0.3 규칙과 대칭.
#   3. **부분취소 허용 시점 = 완료(COMPLETED) 이후.** `AWAITING_DEPOSIT`
#      (입금대기)에서는 **전체 취소만** 허용한다 — 일부만 취소하면 입금액이
#      바뀌어 입금 안내(S1-C4) 재발행과 관리자 수동 입금확인이 어긋나기
#      때문. 이 규칙은 `Booking.cancellationScope`로 표현하고, 위반 시
#      409 `PARTIAL_CANCEL_NOT_ALLOWED`.
#   4. **1 예약번호 = N 항목**을 계약에 명시. `BookingItem.bookingItemId`를
#      필수로 추가(항목 지정의 키), `BookingSummary`에 `itemCount`·
#      `partiallyCancelled`를 추가해 목록 카드의 "대표 상품명 외 N건"·
#      부분취소 뱃지를 서버 값으로 그릴 수 있게 했다.
#   5. 취소 확정 시 재고 복원 범위를 **해당 항목·날짜**로 한정(문서화).
#
# v0.3 변경(2026-08-25, PM 확정 반영 — 노션 "자전거 예약 MVP 상세 기능
# 명세 최종화"(2026-08-19)를 기준으로 정리):
#   1. 예약 상태 전이 순서 확정(Model B): 생성=입금대기 → 입금확인요청=
#      접수 → 관리자 입금확인=완료. 입금대기·취소요청은 목록 탭 필터에서
#      빠지고 '전체' 탭 안에서 뱃지로만 노출(아래 GET /bookings 참고).
#   2. 임시 홀드 TTL = 15분 확정.
#   3. 취소 수수료 요율 D-7↑10% / D-6~3 20% / D-2~1 30% / 당일 50%를
#      초기값으로 확정. 단, 이 구간·요율은 **DB(정책 테이블)로 관리**하며
#      하드코딩하지 않는다 — 관리자 화면 a-set(S1-A10 계좌·정책 설정)이
#      이미 이 편집 UI로 와이어프레임에 존재하므로, 훗날 그 화면용 관리자
#      CRUD API(별도 문서, chinguya-admin-product-api.yaml과 같은 패턴)를
#      추가해 이 값을 관리하게 될 수 있다.
#   4. 상품/가용성 표기 세부: (a) 카테고리 쿼리 파라미터 방식(GET
#      /products?category=)을 프론트 URL 스킴으로 추천·확정 — 근거는
#      파일 하단 "추천 사항" 참고. (b) 2일+타지역 반납 자동 마감은
#      결정 로그대로 '마감' 단일 표기로 확정(별도 reason 필드 불필요).
#
# ⚠ 남은 협의 항목은 본문에 TODO(협의)로 표시했다. 목록은 파일 하단 참고.
# =============================================================================

info:
  title: 친구야 Core API — Slice 1 (자전거 예약 MVP)
  version: 0.11.0-draft
  description: |
    고객 자전거 예약 MVP의 Core API.
    - 통화: KRW 정수(원). 소수점 없음.
    - 언어: 한국어 단일(i18n 미사용).
    - 날짜: `YYYY-MM-DD`. 예약 가능 기간 판정의 '오늘'은 **일본 시간(JST)** 기준.
    - 상품 사진·설명은 대여 옵션(2시간/1일/2일/야간)별로 다를 수 있다
      (관리자가 옵션 단위로 등록·관리, chinguya-admin-product-api.yaml 참고).
      상품 상세(S3-C1)에서 옵션을 바꾸면 해당 옵션의 사진·설명으로 전환된다.
      **와이어프레임 개편(2026-09-02)**: 상품 상세(S3-C1)와 예약·캘린더
      (S1-C2)는 한 화면으로 통합됐다. API 계약은 영향 없음(같은 엔드포인트를
      한 화면에서 연달아 호출).
    - 예약 상태 전이(Model B, 2026-08-19 확정): 생성 시 `AWAITING_DEPOSIT`
      (입금대기) → 고객이 입금확인요청 시 `RECEIVED`(접수) → 관리자가
      입금 확인 시 `COMPLETED`(완료). 취소는 `CANCEL_REQUESTED`(취소요청)
      → 관리자 환불 처리 후 `CANCELLED`(취소).
    - **예약 구성 단위(v0.4 확정)**: **1 예약번호 = N 항목**(상품 × 옵션 ×
      이용일 조합). 항목마다 상품·옵션·이용일·수량·금액이 다를 수 있으므로
      예약을 단일 상품·단일 이용일로 표기하지 않는다.
    - **부분취소(v0.4 확정)**: 항목 단위 취소를 지원한다. 수수료는 **항목별
      이용일 기준**으로 각각 산정해 합산한다(예약 단위 일괄 산정 불가).
      부분취소는 **완료(COMPLETED) 이후**부터 허용하며, **입금대기
      (AWAITING_DEPOSIT)에서는 전체 취소만** 가능하다. 부분취소는 별도
      상태값이 아니라 `Booking.partiallyCancelled` 플래그로 표현하고,
      예약 상태는 유효 항목 기준으로 유지한다.
    - 임시 홀드 TTL = 15분(확정). 취소 수수료 요율은 초기값 확정 +
      DB 관리 전제(하단 CancellationQuote 참고).

servers:
  - url: https://api.chinguya.co.kr/v1
    description: 운영(prod)
  - url: http://localhost:8080/v1
    description: 로컬 개발

tags:
  - name: products
    description: 상품 조회·상세 (S1-C1, S3-C1)
  - name: availability
    description: 가용성 조회 (S1-C2)
  - name: cart
    description: 장바구니·임시 홀드 (S1-C2 담기 → S1-C3)
  - name: bookings
    description: 예약 생성·조회·입금요청 (S1-C3, S1-C4, S1-C5, S1-C6)
  - name: cancellation
    description: 취소 견적·요청 (S1-C7, 항목 단위)
  - name: auth
    description: 고객 카카오 로그인·회원가입·세션 (S0-C1, S0-C2, S0-C3)
  - name: faq
    description: 자주 묻는 질문 (S4-C3)
  - name: inquiries
    description: 1:1 질문하기 — 목록·작성·상세·삭제 (S4-C4, S4-C5)

# -----------------------------------------------------------------------------
paths:

  /products:
    get:
      tags: [products]
      summary: 상품 목록 조회 (S1-C1)
      x-screens: [S1-C1]
      description: |
        관리자가 '표출 ON'한 상품만, 카테고리별로 조회. 가격은 고객가 기준.
        비로그인 열람 허용(예약 단계부터 인증 필요).

        **카드 1개 = 연결 자산 1개(v0.6).** 관리자 상품은 자산 × 대여 옵션 단위지만
        고객앱은 자산 단위로 카드를 그리고, 옵션은 상품 상세(S3-C1)의 칩으로 보여준다.
        그래서 `productId`는 자산 id다. '표출 ON' 상품이 1개 이상인 자산만 오며,
        카테고리는 자산의 카테고리다. 정렬은 자산 등록순.

        URL 스킴(추천·확정, 하단 "추천 사항" 참고): Core API는 `category`
        쿼리 파라미터로 단일 엔드포인트를 유지한다. 프론트(Next.js)는 이를
        감싸 `/bicycles`처럼 사람이 읽기 좋은 라우트를 노출하되, 내부적으로
        `GET /products?category=BICYCLE`을 호출한다 — Slice 3의 낚싯대
        (`FISHING_ROD`) 추가 시 새 Core API 엔드포인트 없이 확장된다.
      security: []
      parameters:
        - name: category
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ProductCategory' }
          description: 카테고리 필터. Slice 1은 사실상 bicycle.
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 상품 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListPage'
        '400': { $ref: '#/components/responses/BadRequest' }

  /products/{productId}:
    get:
      tags: [products]
      summary: 상품 상세 조회 (S3-C1)
      x-screens: [S3-C1, S1-C2]
      description: |
        **v0.7**: `productId`는 목록(S1-C1)과 같은 **연결 자산 id**이고, `options[]`는
        그 자산의 '표출 ON' 상품이다(칩 순서 2시간 → 1일 → 2일 → 야간). 표출 ON 상품이
        하나도 없으면 404 `PRODUCT_NOT_FOUND`. 자산에는 설명·사진이 따로 없어 상품 레벨
        `description`은 비어 있고, `imageUrls`는 목록 썸네일과 같은 대표 옵션(1일권 우선)의
        사진이다.

        선택 상품의 대여 옵션(2시간/1일/2일/야간)별 요금을 반환한다.
        2일 옵션에는 '타지역 반납(추가요금)' 가용 여부·추가요금이 포함된다.
        여기서 고른 옵션이 (같은 화면의) 예약 캘린더 날짜 선택 규칙을 결정한다.
        각 옵션(`options[]`)은 관리자가 옵션 단위로 등록한 자체 사진·설명을
        가질 수 있다 — 화면에서 옵션을 바꾸면 `options[].imageUrls`·
        `options[].description`으로 갤러리·설명을 전환하고, 값이 없는
        옵션은 상품 레벨 `imageUrls`·`description`(폴백)을 그대로 쓴다.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
      responses:
        '200':
          description: 상품 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{productId}/availability:
    get:
      tags: [availability]
      summary: 가용성 조회 (S1-C2 캘린더)
      x-screens: [S1-C2]
      description: |
        선택 옵션 기준으로 예약 가능 날짜와 날짜별 가용 수량 상한을 반환한다.
        규칙:
        - 예약 가능 기간: 오늘(+1일) ~ +3개월. '오늘'은 JST 기준.
        - 가용성 = 재고 × 슬롯 겹침으로 판정.
        - 옵션별 선택 단위: 2시간·1일 → 1일 / 2일 → 연속 2일 / 야간 → 야간 가능일 중 1일.
        - `daysRequired=2`(2일 옵션)에서 각 date는 **연속 2일 예약의 시작일**을 의미한다.
        - 2일 + 타지역 반납 선택 시 익일·익익일 자동 마감(엔진 내부 처리).
          **확정**: 자동 마감된 날짜도 `selectable=false`로만 표기하는
          단일 '마감' 처리다 — 마감 사유를 구분하는 별도 `reason` 필드는
          두지 않는다(결정 로그 2026-08-19).

        **v0.7 확정(2026-09-14)**:
        - 잔여 = 그날 고객 가용(S1-A3 재고 세팅: 총 보유 − 여행사 할당, 매장 휴무면 0)
          − 예약 점유 − 만료 전 임시 홀드. 재고는 **자산 단위**라 같은 자산의 옵션끼리 공유한다.
        - 옵션과 무관하게 **하루 단위**로 점유한다(2시간도 그날 하루). 야간은 운영일을
          따로 두지 않고 재고가 있는 날이면 모두 가능하다.
        - 2일 + 타지역 반납 = 이용 이틀 + **반납 다음 날(시작일 +2)까지 같은 수량 점유**.
          위의 "익일·익익일 자동 마감"을 이렇게 구현한다.
        - `remaining` = 그 날짜를 시작일로 잡을 때 점유하는 날들의 잔여 최솟값.
          이용일이 예약 가능 기간을 벗어나면 `selectable=false`, `remaining=0`.
        - `crossRegionReturn=true`는 그 옵션에서 타지역 반납을 고를 수 있을 때만 반영한다
          (아니면 무시하고 응답의 `crossRegionReturn`은 false).
        - 필수 파라미터 누락·`from > to`는 400 `VALIDATION_ERROR`, 없거나 표출 OFF인
          상품·옵션은 404 `PRODUCT_NOT_FOUND`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
        - name: optionType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RentalOptionType' }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          description: 조회 시작일(JST). 미지정 하한은 서버가 오늘+1로 보정.
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          description: 조회 종료일(JST). 상한 초과분은 서버가 +3개월로 보정.
        - name: crossRegionReturn
          in: query
          schema: { type: boolean, default: false }
          description: 타지역 반납 여부(2일 옵션에서만 유효).
      responses:
        '200':
          description: 날짜별 가용성
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /content/images/{fileName}:
