      x-screens: [S1-C3]
      description: |
        담긴 항목·임시 홀드 만료시각·합계를 반환한다. 홀드가 만료된 항목은 조회할 때
        지워지고 응답에서 빠진다(잔여 계산에서는 만료 시각에 이미 빠져 있다).
      responses:
        '200':
