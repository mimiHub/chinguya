                type: array
                items: { $ref: '#/components/schemas/Faq' }

  /inquiries:
    get:
      tags: [inquiries]
      summary: 질문 목록 (S4-C4, v0.12)
      x-screens: [S4-C4]
      description: |
        모든 고객의 질문을 최신순으로 돌려준다. **제목·상태만** 담는다 — 본문·답변은 상세에서 본인 글만.
        본인 글은 `mine: true`(화면은 남의 글을 잠금 표시). 페이지네이션 없음. 없으면 빈 배열.
      responses:
        '200':
          description: 최신순 질문 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InquirySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [inquiries]
      summary: 질문 등록 (S4-C5, v0.12)
      x-screens: [S4-C5]
      description: 제목·본문 앞뒤 공백은 서버가 제거한다. 등록 후 수정할 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InquiryCreateRequest' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InquiryDetail' }
        '400':
          description: 제목·본문 누락 또는 길이 초과(`VALIDATION_ERROR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /inquiries/{inquiryId}:
    parameters:
      - name: inquiryId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [inquiries]
      summary: 내 질문 상세 (S4-C5, v0.12)
      x-screens: [S4-C5]
      description: 본인 글만. 남의 글·없는 글은 404 `INQUIRY_NOT_FOUND`.
      responses:
        '200':
          description: 질문 본문과 관리자 답변
          content:
