              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /cart/items:
    post:
      tags: [cart]
      summary: 장바구니 담기 = 임시 홀드 생성 (S1-C2 '장바구니 담기')
      x-screens: [S1-C2]
      description: |
        선택 상품·옵션·날짜·수량으로 재고에 **임시 홀드**를 걸어 중복 예약을 방지한다.
        응답의 `holdExpiresAt`까지 유효하며, 만료 시 홀드는 해제된다.
        홀드 TTL = **15분(확정)**.

        **v0.7**:
        - 금액: `unitPrice` = 고객가, `extraFee` = 타지역 반납 대당 추가요금 × 수량,
          `lineTotal` = 고객가 × 수량 + `extraFee`(담는 시점 스냅샷).
        - 점유·잔여 규칙은 가용성 조회와 같다. 잔여가 수량보다 적으면 409 `OUT_OF_STOCK`.
        - 이용일이 예약 가능 기간(오늘+1 ~ +3개월, JST) 밖이면 400 `DATE_NOT_BOOKABLE`.
        - 없거나 표출 OFF인 상품·옵션은 404 `PRODUCT_NOT_FOUND`.
        - 타지역 반납을 고를 수 없는 옵션에 `crossRegionReturn=true`면 400 `VALIDATION_ERROR`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemCreate' }
      responses:
        '201':
          description: 홀드 성공(장바구니 항목 생성)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 재고 부족 등으로 홀드 불가
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /cart/items/{cartItemId}:
