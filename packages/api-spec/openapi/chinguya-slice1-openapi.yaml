      responses:
        '200':
          description: 글 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticeDetail' }
        '404':
          description: 존재하지 않거나 **숨겨진** 글(`NOTICE_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /faqs:
    get:
      tags: [faq]
      summary: FAQ 목록 (S4-C3, v0.11)
      x-screens: [S4-C3]
      description: |
